[workspace]
members = ["apps/*", "crates/*"]
# apps/tasks-ts is a TypeScript app of the pnpm workspace, not a crate.
exclude = ["apps/tasks-ts"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nocentraldb/nocentraldb"

[workspace.dependencies]
# Dependencies between workspace crates are declared here, with their path and
# `version = "=<workspace version>"`, and used as `name.workspace = true`;
# set-version keeps the pin equal to the version (check-version checks it).
ncdb-core = { path = "crates/ncdb-core", version = "=0.1.0" }
ncdb-harness = { path = "crates/ncdb-harness", version = "=0.1.0" }
ncdb-plugin = { path = "crates/ncdb-plugin", version = "=0.1.0" }
ncdb-test-counter = { path = "crates/ncdb-test-counter", version = "=0.1.0" }
ncdb-relay = { path = "crates/ncdb-relay", version = "=0.1.0" }
ncdb-relay-server = { path = "crates/ncdb-relay-server", version = "=0.1.0" }
ncdb-relay-lambda = { path = "crates/ncdb-relay-lambda", version = "=0.1.0" }
ncdb-relay-aws = { path = "crates/ncdb-relay-aws", version = "=0.1.0" }
nocentraldb = { path = "crates/nocentraldb", version = "=0.1.0" }

# Debug and test builds keep only line tables, not full debug info: panics
# and backtraces still name file and line, and a full `pnpm gates`, which
# builds every crate natively and for wasm32, fits an agent container's disk
# (NOC-279). Full debug info filled more than 27 GiB and ran out of space.
[profile.dev]
debug = "line-tables-only"

# Debug tests spend most of their time in signature checks, key agreement and
# hashing. Optimizing only these crates keeps the core's own code unoptimized,
# so tests still debug as before, and changes nothing in release builds.
[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.x25519-dalek]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hkdf]
opt-level = 3

[profile.dev.package.hpke]
opt-level = 3
