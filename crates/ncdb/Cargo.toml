[package]
name = "ncdb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "The NoCentralDB command line: ncdb model build and ncdb model check (RFC 0005)."
keywords = ["local-first", "database", "schema", "cli"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "ncdb"
path = "src/main.rs"

# The lock, its canonical form and the additive-change rule live in the core
# (ncdb-core::model_lock), so the device check runs the same rule.
[dependencies]
ncdb-core.workspace = true
