language: rust
layer: library

# The SDK also runs in the browser (GENESIS.md, principle 7; NOC-175), so
# its gates build it for wasm32-unknown-unknown and run its in-memory tests
# there, as the core's do, next to the native tasks inherited from
# .moon/tasks/rust.yml. Deps of `gates` merge with the inherited ones.
tasks:
  build-wasm:
    command: "cargo build --locked -p $project --target wasm32-unknown-unknown"
  test-wasm:
    # Cargo runs each wasm test binary through wasm-bindgen-test-runner, in
    # Node, which repo:wasm-runner installs at its pinned version.
    command: "cargo test --locked -p $project --target wasm32-unknown-unknown --lib"
    deps: ["repo:wasm-runner"]
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: "$workspaceRoot/target/tools/bin/wasm-bindgen-test-runner"
  # Rich text folds only with the compiler cfg `ncdb_rich_text`, which only
  # the project's own CI sets (NOC-468; crates/ncdb-core/moon.yml). The SDK
  # and its bridge to the TypeScript SDK (NOC-461) are linted and tested
  # with it too, with the feature `bridge` on, natively, in the target
  # directory the core's rich-text tasks use.
  lint-rich-text:
    command: "cargo clippy --locked -p $project --features bridge --all-targets -- -D warnings"
    env:
      RUSTFLAGS: "--cfg ncdb_rich_text"
      CARGO_TARGET_DIR: "$workspaceRoot/target/rich-text"
  test-rich-text:
    command: "cargo test --locked -p $project --features bridge --lib"
    env:
      RUSTFLAGS: "--cfg ncdb_rich_text"
      CARGO_TARGET_DIR: "$workspaceRoot/target/rich-text"
  gates:
    deps: ["~:build-wasm", "~:test-wasm", "~:lint-rich-text", "~:test-rich-text"]
