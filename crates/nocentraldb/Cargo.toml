[package]
name = "nocentraldb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The Rust SDK of NoCentralDB (RFC 0009): open a database, write, read, query and subscribe, and sync with a relay (RFC 0007)."

# The SDK wraps the core: the change, its signature and seal, membership and
# the local view on SQLite. The view is native only, so is this crate.
[dependencies]
ncdb-core.workspace = true
# The `Stream` a subscription returns (RFC 0009, "The Rust SDK"). The version
# Cargo.lock already held.
futures-core = { version = "=0.3.34", default-features = false, features = ["std"] }
# The account key that signs the member's certificate, as the core's
# certificate takes it.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
# The member key's and the account key's secrets, from the platform's secure
# generator, wiped from memory when they are dropped.
getrandom = { version = "=0.4.3", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }
# The account's fingerprint (RFC 0010, "The fingerprint"). The version the
# core already pins.
sha2 = { version = "=0.11.1", default-features = false }
# An invitation's text form, unpadded base64url (RFC 0003, "Invitation"),
# strict about padding and trailing bits. The version Cargo.lock already held
# for tokio-tungstenite.
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }
# Syncing with one relay (RFC 0007, "The protocol"): a WebSocket client on
# a tokio runtime of the SDK's own, on a thread of its own, so an app needs
# no runtime. The versions Cargo.lock already held for the relay server.
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = { version = "=0.8.5", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
# What the member signs to authenticate a connection, as the relay checks
# it (RFC 0003, decision 13).
ncdb-relay.workspace = true
# The member key and the account key of a database at a path live in the
# platform keystore (RFC 0003, "The member key"; RFC 0009, S19), through
# keyring-core and one store per platform: the Keychain on macOS, the
# Credential Manager on Windows, the Secret Service on Linux, reached in pure
# Rust over D-Bus, so no system library is needed to build.
keyring-core = { version = "=1.0.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["crypto-rust"] }

# The sync tests run the relay server on SQLite locally and talk to it as a
# simulated member would.
[dev-dependencies]
ncdb-relay-server.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "time", "io-util", "net", "macros"] }
# A backup of the relay's database, to restore it from (RFC 0007,
# "Restores and the relay epoch").
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
