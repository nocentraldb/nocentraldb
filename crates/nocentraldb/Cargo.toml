[package]
name = "nocentraldb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The Rust SDK of NoCentralDB (RFC 0009): open a database, write, read, query and subscribe, and sync with a relay (RFC 0007)."

# The SDK wraps the core: the change, its signature and seal, membership and
# the local view on SQLite. The view is native only, so is this crate.
[dependencies]
ncdb-core.workspace = true
# The `Stream` a subscription returns (RFC 0009, "The Rust SDK"). The version
# Cargo.lock already held.
futures-core = { version = "=0.3.34", default-features = false, features = ["std"] }
# The account key that signs the member's certificate, as the core's
# certificate takes it.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
# The member key's and the account key's secrets, from the platform's secure
# generator, wiped from memory when they are dropped.
getrandom = { version = "=0.4.3", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }
# The account's fingerprint (RFC 0010, "The fingerprint"). The version the
# core already pins.
sha2 = { version = "=0.11.1", default-features = false }
# An invitation's text form, unpadded base64url (RFC 0003, "Invitation"),
# strict about padding and trailing bits. The version Cargo.lock already held
# for tokio-tungstenite.
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }
# The channels that tell syncing that the database wrote or paused, on
# every target; the runtime, sockets and timers of syncing are native only
# (below). The version Cargo.lock already held for the relay server.
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }
# The member key and the account key of a database at a path live in the
# platform keystore (RFC 0003, "The member key"; RFC 0009, S19), through
# keyring-core and one store per platform: the Keychain on macOS, the
# Credential Manager on Windows, the Secret Service on Linux, reached in pure
# Rust over D-Bus, so no system library is needed to build.
keyring-core = { version = "=1.0.1", default-features = false }

# Syncing with one relay (RFC 0007, "The protocol"), natively: a WebSocket
# client on a tokio runtime of the SDK's own, on a thread of its own, so an
# app needs no runtime. The versions Cargo.lock already held for the relay
# server. In the browser, syncing runs over the browser's WebSocket, which
# a later slice builds (NOC-175).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "sync", "time", "macros"] }
# TLS for `wss://` and the `https://` URLs of large changes (NOC-121):
# rustls on the ring provider, with the platform's root certificates read
# by rustls-native-certs, for the WebSocket and for the HTTP client.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = { version = "=0.8.5", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
# What the member signs to authenticate a connection, as the relay checks
# it (RFC 0003, decision 13).
ncdb-relay.workspace = true

# On wasm32 (NOC-175): the secure generator through the browser's
# crypto.getRandomValues, as the core has it, and the wall clock through
# JavaScript's Date.now() (src/clock.rs). The versions the core pins.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", default-features = false, features = ["wasm_js"] }
js-sys = { version = "=0.3.107", default-features = false, features = ["std"] }
# The member's keys in the browser (NOC-175 slice 2; NOC-210 Q1 and Q2 A):
# the key record sealed with AES-GCM under a non-extractable WebCrypto key,
# both kept in IndexedDB, reached through web-sys and awaited through
# wasm-bindgen-futures. The versions the core pins.
wasm-bindgen = { version = "=0.2.130", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "=0.4.80", default-features = false, features = ["std"] }
web-sys = { version = "=0.3.107", default-features = false, features = ["std", "AesGcmParams", "AesKeyGenParams", "Crypto", "CryptoKey", "DomException", "Event", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "SubtleCrypto"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["crypto-rust"] }

# The sync tests run the relay server on SQLite locally and talk to it as a
# simulated member would. Natively only: they need sockets and threads.
# The test plugin, test/counter, and the plugin crate's Plugin to build
# refused ones (RFC 0011).
[dev-dependencies]
ncdb-test-counter.workspace = true
ncdb-plugin.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ncdb-relay-server.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "time", "io-util", "net", "macros"] }
# A backup of the relay's database, to restore it from (RFC 0007,
# "Restores and the relay epoch").
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }

# The test-wasm task (moon.yml) runs the in-memory tests on wasm32 with
# wasm-bindgen-test, the version the core's wasm tests pin.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"
