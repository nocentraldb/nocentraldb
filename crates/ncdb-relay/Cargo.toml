[package]
name = "ncdb-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The NoCentralDB relay core: the checks of RFC 0007, the backend interface and the SQLite backend."

# The relay runs natively only: on a server and in AWS Lambda, never in a
# browser. Every dependency is pinned to one exact version, the one the core
# already uses.
[dependencies]
ncdb-core.workspace = true
# The relay authenticates a connection with the member's Ed25519 key over
# H("nocentraldb/relay-auth" || relay id || nonce) (RFC 0003, decision 13).
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
# A new relay epoch: 16 bytes from the platform's secure generator.
getrandom = { version = "=0.4.3", default-features = false }
# The SQLite backend (RFC 0007, "The backend interface"), with SQLite
# compiled from source, as in the core.
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
