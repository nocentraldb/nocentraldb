[package]
name = "ncdb-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "The relay core of NoCentralDB, a local-first database: the checks a relay runs on signed, encrypted changes it cannot read (RFC 0007), the backend interface and the SQLite backend."
keywords = ["local-first", "relay", "sync", "encryption", "sqlite"]
categories = ["database-implementations", "network-programming"]

# The relay runs natively only: on a server and in AWS Lambda, never in a
# browser. Every dependency is pinned to one exact version, the one the core
# already uses.
[dependencies]
# A message travels as base64 in a text frame (RFC 0007, "Transport and
# encoding"; NOC-338).
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
ncdb-core.workspace = true
# The relay authenticates a connection with the member's Ed25519 key over
# H("nocentraldb/relay-auth" || relay id || nonce) (RFC 0003, "The member key").
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
# A new relay epoch: 16 bytes from the platform's secure generator.
getrandom = { version = "=0.4.3", default-features = false }
# The SQLite backend (RFC 0007, "The backend interface"), with SQLite
# compiled from source, as in the core.
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
