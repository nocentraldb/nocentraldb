language: rust
layer: library

# The crate exists for wasm32 (@nocentraldb/sdk's ncdb bin), so its gates
# build it there too, next to the native tasks inherited from
# .moon/tasks/rust.yml. packages/sdk/test/ncdb.test.ts runs what it builds.
tasks:
  build-wasm:
    command: "cargo build --locked -p $project --target wasm32-unknown-unknown"
  gates:
    deps: ["~:build-wasm"]
