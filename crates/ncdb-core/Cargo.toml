[package]
name = "ncdb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The change and the log (RFC 0002, NOC-14); signing and sealing it
# (RFC 0003, NOC-15). Every dependency is pinned to one
# exact version.
[dependencies]
# What a plugin field type implements, and the ids, clock values and
# canonical CBOR the core shares with it (RFC 0011).
ncdb-plugin.workspace = true
# The CBOR tokens of the canonical encoding; the profile's restrictions are
# checked in src/cbor.rs.
minicbor = { version = "=2.3.1", default-features = false, features = ["alloc"] }
# Change ids are SHA-256 in every suite (RFC 0002, "Change ids"). Its
# `zeroize` feature wipes the hash state, and with it HKDF's, on drop.
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
# Object and space ids: 128 bits from the platform's secure generator,
# crypto.getRandomValues in the browser (RFC 0002, "Object ids").
getrandom = { version = "=0.4.3", default-features = false }
# Signing and encrypting a change, with the primitives RFC 0003 names
# ("Primitives"). Ed25519 signatures, verified with verify_strict. 2.x
# includes the fix of RUSTSEC-2022-0093.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
# Pinned directly although ed25519-dalek brings it, so that the version that
# fixes RUSTSEC-2024-0344 (4.1.3; 4.2.0 is yanked) cannot be resolved away. It also
# computes the X25519 public half of a member key for the member id.
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "zeroize"] }
# XChaCha20-Poly1305, the content encryption of suite 1. Its `zeroize`
# feature wipes the key the cipher holds on drop.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# HKDF-SHA256, which derives the content key from the space key.
hkdf = { version = "=0.13.0", default-features = false }
# HPKE (RFC 9180) wraps a space key to a member's X25519 key in a key
# envelope (RFC 0003, "Primitives" and "Key envelope"), base mode with
# DHKEM(X25519, HKDF-SHA256), HKDF-SHA256 and ChaCha20-Poly1305 only. It runs
# on the same chacha20poly1305, hkdf and sha2 as above, and brings
# x25519-dalek 3 with curve25519-dalek 5. No `getrandom` feature: the core
# draws the ephemeral key's input itself (src/envelope.rs).
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
# Wipes key bytes from memory when they are dropped.
zeroize = { version = "=1.9.1", default-features = false }
# Reads model.lock.json and the schema description `ncdb model build` gets
# from the TypeScript module (RFC 0005, NOC-70). The version Cargo.lock
# already held.
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
# The pairing answer's text form, unpadded base64url (RFC 0010, "The pairing
# answer"), strict about padding and trailing bits. The version the Rust SDK
# already pins for the invitation.
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }

# The local view (RFC 0006, "SQLite on each target"): one rusqlite on every
# target. Natively with SQLite compiled from source (`bundled`), never the
# system's SQLite; on wasm32 through `ffi-sqlite-wasm-rs`, SQLite compiled to
# wasm32-unknown-unknown by sqlite-wasm-rs. Both build the same SQLite
# release, which tests/sqlite_release.rs checks on both targets.
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "ffi-sqlite-wasm-rs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", default-features = false, features = ["wasm_js"] }
# The browser's SQLite (RFC 0006, "The browser"), pinned here although
# rusqlite brings it, so that its SQLite release cannot drift from the one
# libsqlite3-sys builds natively: 0.6.3 and libsqlite3-sys 0.39.1 both carry
# SQLite 3.54.1. Its `wasm-bindgen` feature provides the host functions.
sqlite-wasm-rs = { version = "=0.6.3", default-features = false, features = ["wasm-bindgen"] }
# The `opfs-sahpool` VFS on the Origin Private File System, in a dedicated
# Web Worker (RFC 0006, "The browser"; src/view/browser.rs).
sqlite-wasm-vfs = { version = "=0.3.0", default-features = false, features = ["sahpool"] }
# src/view/browser.rs tells a dedicated worker from the page's main thread;
# the versions Cargo.lock already holds.
js-sys = { version = "=0.3.107", default-features = false, features = ["std"] }
wasm-bindgen = { version = "=0.2.130", default-features = false, features = ["std"] }
web-sys = { version = "=0.3.107", default-features = false, features = ["std", "DedicatedWorkerGlobalScope"] }

# The native SQLite, pinned here although rusqlite brings it, for the same
# reason: libsqlite3-sys 0.39.1 builds SQLite 3.54.1 with `bundled`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libsqlite3-sys = { version = "=0.39.1", default-features = false }

[dev-dependencies]
# The test plugin, test/counter, which the view folds (RFC 0011).
ncdb-test-counter.workspace = true
# The convergence harness every field type is checked by (RFC 0011).
ncdb-harness.workspace = true
# The convergence harness (tests/support/convergence.rs) generates and shrinks
# with proptest. Without default features it uses no threads, no fork and no
# OS randomness, so the harness also runs on wasm32 (NOC-10).
proptest = { version = "=1.12.0", default-features = false, features = ["alloc", "no_std"] }

# The test-wasm task (crates/ncdb-core/moon.yml) runs the tests on wasm32
# with wasm-bindgen-test. The runner, wasm-bindgen-cli, must be the version of
# wasm-bindgen that Cargo.lock holds; the root task `wasm-runner` pins it.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"
# The browser view's harness (examples/browser_view.rs) exports its calls
# to the worker with the wasm-bindgen that Cargo.lock holds, its async
# `open` through wasm-bindgen-futures.
wasm-bindgen = { version = "=0.2.130", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "=0.4.80", default-features = false, features = ["std"] }
