language: rust
layer: library

# The core also runs in the browser (GENESIS.md, principle 7), so its gates
# build it for wasm32-unknown-unknown and run its tests there, next to the
# native tasks inherited from .moon/tasks/rust.yml. Deps of `gates` merge
# with the inherited ones.
tasks:
  build-wasm:
    command: "cargo build --locked -p $project --target wasm32-unknown-unknown"
  test-wasm:
    # Cargo runs each wasm test binary through wasm-bindgen-test-runner, in
    # Node, which repo:wasm-runner installs at its pinned version.
    command: "cargo test --locked -p $project --target wasm32-unknown-unknown"
    deps: ["repo:wasm-runner"]
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: "$workspaceRoot/target/tools/bin/wasm-bindgen-test-runner"
  # Rich text folds only with the compiler cfg `ncdb_rich_text`, which
  # only these tasks set: the fold stays off in every published build until
  # its guard is complete (NOC-468). Its code and tests are gated all the
  # same: lint and the whole suite with the cfg, natively, and the
  # rich-text tests on wasm32 (C3). They build into a target directory of
  # their own, so the cfg does not rebuild the other tasks' builds.
  lint-rich-text:
    command: "cargo clippy --locked -p $project --all-targets -- -D warnings"
    env:
      RUSTFLAGS: "--cfg ncdb_rich_text"
      CARGO_TARGET_DIR: "$workspaceRoot/target/rich-text"
  test-rich-text:
    command: "cargo test --locked -p $project"
    env:
      RUSTFLAGS: "--cfg ncdb_rich_text"
      CARGO_TARGET_DIR: "$workspaceRoot/target/rich-text"
  test-wasm-rich-text:
    command: "cargo test --locked -p $project --target wasm32-unknown-unknown --test rich_text_agreement --test rich_text_client_id --test rich_text_contract --test rich_text_fold --test rich_text_lease --test rich_text_update_format --test rich_text_view"
    deps: ["repo:wasm-runner"]
    env:
      RUSTFLAGS: "--cfg ncdb_rich_text"
      CARGO_TARGET_DIR: "$workspaceRoot/target/rich-text"
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: "$workspaceRoot/target/tools/bin/wasm-bindgen-test-runner"
  gates:
    deps: ["~:build-wasm", "~:test-wasm", "~:lint-rich-text", "~:test-rich-text", "~:test-wasm-rich-text"]
