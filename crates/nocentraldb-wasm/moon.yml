language: rust
layer: library

# The crate exists for wasm32 (the TypeScript SDK's worker), so its gates
# build it there and run its tests there too, next to the native tasks
# inherited from .moon/tasks/rust.yml, as crates/nocentraldb/moon.yml does.
tasks:
  build-wasm:
    command: "cargo build --locked -p $project --target wasm32-unknown-unknown"
  test-wasm:
    command: "cargo test --locked -p $project --target wasm32-unknown-unknown --lib"
    deps: ["repo:wasm-runner"]
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: "$workspaceRoot/target/tools/bin/wasm-bindgen-test-runner"
  gates:
    deps: ["~:build-wasm", "~:test-wasm"]
