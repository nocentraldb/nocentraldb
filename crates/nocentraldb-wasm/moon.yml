language: rust
layer: library

# The crate exists for wasm32 (the TypeScript SDK's worker), so its gates
# build it there and run its tests there too, next to the native tasks
# inherited from .moon/tasks/rust.yml, as crates/nocentraldb/moon.yml does.
tasks:
  build-wasm:
    command: "cargo build --locked -p $project --target wasm32-unknown-unknown"
  test-wasm:
    command: "cargo test --locked -p $project --target wasm32-unknown-unknown --lib"
    deps: ["repo:wasm-runner"]
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: "$workspaceRoot/target/tools/bin/wasm-bindgen-test-runner"
  # With the compiler cfg `ncdb_rich_text`, which only these tasks set
  # (NOC-468): the core with the rich-text bridge builds for wasm32 and
  # lints, in the target directory the other crates' rich-text tasks use.
  # The package's build refuses this core (packages/sdk/richText.mjs).
  build-wasm-rich-text:
    command: "cargo build --locked -p $project --target wasm32-unknown-unknown"
    env:
      RUSTFLAGS: "--cfg ncdb_rich_text"
      CARGO_TARGET_DIR: "$workspaceRoot/target/rich-text"
  lint-rich-text:
    command: "cargo clippy --locked -p $project --target wasm32-unknown-unknown --all-targets -- -D warnings"
    env:
      RUSTFLAGS: "--cfg ncdb_rich_text"
      CARGO_TARGET_DIR: "$workspaceRoot/target/rich-text"
  gates:
    deps: ["~:build-wasm", "~:test-wasm", "~:build-wasm-rich-text", "~:lint-rich-text"]
