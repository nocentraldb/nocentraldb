# site/ is its own pnpm project, outside the repository's workspace (NOC-211):
# its dependencies never enter the root lockfile or the gates until a later
# ticket wires the site into them.
packages: []
saveExact: true
onlyBuiltDependencies: []
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.13.2'
  - '@astrojs/markdown-satteri@0.4.8'
  - '@astrojs/runtime@0.1.0'
  - '@astrojs/vite-plugin-astro@0.1.1'
  - astro@7.4.10
