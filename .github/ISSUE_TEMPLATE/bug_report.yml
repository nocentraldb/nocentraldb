name: Bug report
description: Something in NoCentralDB breaks, or breaks a promise of an RFC.
labels: ["needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A report we can reproduce is the most useful thing you can send us, and one that names the RFC promise it breaks even more so.

        Found a security problem? Do not file it here: report it privately, see [SECURITY.md](https://github.com/nocentraldb/nocentraldb/blob/main/.github/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste error messages as text.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest sequence of steps or code that shows the problem. Say if it happens every time or only sometimes.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ncdb version or commit
      description: The released version, or the commit SHA you built from.
      placeholder: 0.1.0 or 1a1a5a4
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.4, Ubuntu 24.04, Windows 11, ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - core
        - Rust SDK
        - TS SDK
        - CLI
        - relay
        - docs
    validations:
      required: true
  - type: input
    id: rfc-promise
    attributes:
      label: Which RFC promise does this break?
      description: Optional. The RFC number and section, if the behaviour contradicts what an RFC under docs/rfc/ says.
      placeholder: RFC 0001, The design in one page
    validations:
      required: false
  - type: checkboxes
    id: help-fix
    attributes:
      label: Helping
      options:
        - label: I'd like to help fix this.
          required: false
