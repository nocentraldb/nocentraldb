# CI is the one full, trustworthy run: the uncached project gate `pnpm gates`
# for every project, never `moon ci` (affected-only) and never moon's task
# cache. Only self-validating caches are reused: the Cargo registry and
# target dir, the pnpm store, and the proto tool installs that
# setup-toolchain caches itself (~/.proto, keyed on .prototools).
# The job is bounded in time, superseded pull-request runs are cancelled while
# every push to main runs to the end, and the Cargo cache is bounded in size.
# scripts/ci-workflow.test.mjs asserts these rules.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its superseded run. Pushes to main are
# never cancelled: each commit gets a group of its own (by SHA), because a
# shared group would still cancel a *pending* main run once the next one queues.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    # A hung step stops here instead of at GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      # Default (shallow) checkout depth on purpose: CI runs every task of
      # every project and uses no moon affected detection, so it needs no history.
      # moon still queries changed files on every `moon exec`, and in a pull
      # request it would diff against GITHUB_BASE_REF (`main`), which a shallow
      # checkout lacks; `pnpm gates` pins --base HEAD --head HEAD for that.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs proto, then moon, node and pnpm as pinned in .prototools.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      # Bounded: actions/cache saves only on a key miss, so an entry holds one
      # build for one toolchain and lockfile. No restore-keys on purpose: a
      # fallback would seed each new entry with the previous target/ and let
      # it grow across entries. A toolchain or Cargo.lock change builds cold.
      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.prototools', 'pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm gates
