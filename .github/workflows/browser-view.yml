# NOC-174: runs the core's view in a dedicated worker on OPFS
# (scripts/browser-view/) in Chromium, Firefox and WebKit through
# Playwright on GitHub's Ubuntu runner, and compares what it reads with the
# same code run natively. RFC 0006 ("The spike") asks that the Rust port run
# in Firefox and WebKit before it ships. It is not part of `pnpm gates`,
# which runs without browsers (NOC-33's decision for browser-storage.yml);
# it runs on pull requests that touch the core, the test or the pinned
# dependencies, and by hand. A browser that fails names itself in the
# failing test.
#
# NOC-221: the job does not depend on the runner's apt mirror, whose
# outage failed it before any test ran. The harness is built on the runner,
# which needs no package from apt; the tests run in Playwright's image, which
# holds the browsers and their system libraries at the version package.json
# pins (scripts/browser-view-workflow.test.mjs keeps the two in step).
#
# NOC-175 slice 2: the same job runs the Rust SDK's key tests in IndexedDB
# in a dedicated worker in Chromium (scripts/sdk-keys/), which the gates
# skip in Node, which has no IndexedDB. They are built on the runner as the
# view's harness is, and run on pull requests that touch the SDK.
#
# NOC-175 sync slice: the same step runs the SDK's syncing from the browser
# against the local relay server, which build.mjs builds on the runner next
# to the tests and the test starts in the image; it runs on pull requests
# that touch the relay too.
#
# NOC-176 slice 1: the same job runs the TypeScript SDK in Chromium
# (scripts/sdk-browser/): the package is built on the runner, its core
# compiled to wasm from crates/nocentraldb-wasm, and a page in the image
# opens it as an app does. It runs on pull requests that touch the
# TypeScript SDK or what its core is built from.
#
# The example app apps/tasks-ts: the same job runs the browser task list in
# Chromium on the package built above, as a person uses it, on pull
# requests that touch the app or the TypeScript SDK.
#
# NOC-319: the same job runs the landing page's live demo in Chromium
# (scripts/site-demo/): the site is built on the runner with the demo's
# assets from the package built above, and a page in the image loads it
# after the page renders, on pull requests that touch the site, the demo's
# tests or the TypeScript SDK.
name: browser-view

on:
  pull_request:
    paths:
      - "crates/ncdb-core/**"
      - "crates/nocentraldb/**"
      - "crates/nocentraldb-wasm/**"
      - "packages/sdk/**"
      - "crates/ncdb-relay/**"
      - "crates/ncdb-relay-server/**"
      - "scripts/browser-view/**"
      - "scripts/sdk-keys/**"
      - "scripts/sdk-browser/**"
      - "apps/tasks-ts/**"
      - "site/**"
      - "scripts/site-demo/**"
      - ".github/workflows/browser-view.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Playwright's image at the pinned playwright version, by digest.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27

concurrency:
  group: browser-view-${{ github.ref }}
  cancel-in-progress: true

jobs:
  view:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs proto, then moon, node and pnpm as pinned in .prototools.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-browser-view-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - run: pnpm install --frozen-lockfile

      # The harness for the browser and what the same code reads natively,
      # in target/browser-view (scripts/browser-view/build.mjs). As the root
      # script `gates` does: a CI checkout is shallow, so moon must not diff
      # against `main` to find what changed.
      - name: The harness, built on the runner
        run: |
          moon exec repo:wasm-runner --force --base HEAD --head HEAD
          node scripts/browser-view/build.mjs

      # The SDK's wasm32 library tests and the local relay server, in
      # target/sdk-keys (scripts/sdk-keys/build.mjs), served in the image by
      # the wasm-bindgen-test-runner the step above installed.
      - name: The SDK's key tests, built on the runner
        run: node scripts/sdk-keys/build.mjs

      # The TypeScript SDK's package, in packages/sdk/dist
      # (packages/sdk/build.mjs), with the wasm-bindgen the first step
      # installed; built even when a build above failed, so its tests
      # report on their own.
      - name: The TypeScript SDK, built on the runner
        if: ${{ !cancelled() }}
        run: node scripts/sdk-browser/build.mjs

      # The site with the landing page's demo, in site/dist
      # (scripts/site-demo/build.mjs): the demo's assets from the package
      # built above, then the site; run even when a build above failed.
      - name: The site with its demo, built on the runner
        if: ${{ !cancelled() }}
        env:
          SDK_BROWSER_PREBUILT: "1"
        run: |
          pnpm --dir site install --frozen-lockfile
          node scripts/site-demo/build.mjs

      # A registry that does not answer fails the pull in 4 minutes, and the
      # pull is tried once more.
      - name: Playwright's image, with a short timeout and one retry
        timeout-minutes: 10
        run: |
          for attempt in 1 2; do
            if timeout 240 docker pull "$PLAYWRIGHT_IMAGE"; then exit 0; fi
            echo "docker pull failed (attempt $attempt)"
            sleep 15
          done
          exit 1

      # The tests in the image, on the checkout and its node_modules, with
      # the harness built above.
      - name: The view in a worker in every engine
        run: >-
          docker run --rm --ipc=host
          -v "$PWD:/work" -w /work
          -e BROWSER_VIEW_PREBUILT=1
          "$PLAYWRIGHT_IMAGE"
          node --test 'scripts/browser-view/*.test.mjs'

      # The SDK's keys in IndexedDB and its syncing, in a dedicated worker
      # in Chromium; run even when the view failed, so each reports on its
      # own.
      - name: The SDK's keys in IndexedDB and its syncing in Chromium
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --ipc=host
          -v "$PWD:/work" -w /work
          -e SDK_KEYS_PREBUILT=1
          "$PLAYWRIGHT_IMAGE"
          node --test 'scripts/sdk-keys/*.test.mjs'

      # The TypeScript SDK as an app uses it, its worker and its database on
      # OPFS, in Chromium; run even when a step above failed.
      - name: The TypeScript SDK in Chromium
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --ipc=host
          -v "$PWD:/work" -w /work
          -e SDK_BROWSER_PREBUILT=1
          "$PLAYWRIGHT_IMAGE"
          node --test 'scripts/sdk-browser/*.test.mjs'

      # The example app on the package built above, its own TypeScript
      # compiled in the image; run even when a step above failed.
      - name: The example app in Chromium
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --ipc=host
          -v "$PWD:/work" -w /work
          -e SDK_BROWSER_PREBUILT=1
          "$PLAYWRIGHT_IMAGE"
          node --test 'apps/tasks-ts/e2e/*.e2e.mjs'

      # The landing page's live demo on the site built above; run even when
      # a step above failed.
      - name: The landing page's demo in Chromium
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --ipc=host
          -v "$PWD:/work" -w /work
          -e SITE_DEMO_PREBUILT=1
          "$PLAYWRIGHT_IMAGE"
          node --test 'scripts/site-demo/*.test.mjs'
