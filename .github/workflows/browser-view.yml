# NOC-174: runs the core's view in a dedicated worker on OPFS
# (scripts/browser-view/) in Chromium, Firefox and WebKit through
# Playwright on GitHub's Ubuntu runner, and compares what it reads with the
# same code run natively. RFC 0006 ("The spike") asks that the Rust port run
# in Firefox and WebKit before it ships. It is not part of `pnpm gates`,
# which runs without browsers (NOC-33's decision for browser-storage.yml);
# it runs on pull requests that touch the core, the test or the pinned
# dependencies, and by hand. A browser that fails names itself in the
# failing test.
#
# NOC-221: the job does not depend on the runner's apt mirror, whose
# outage failed it before any test ran. The harness is built on the runner,
# which needs no package from apt; the tests run in Playwright's image, which
# holds the browsers and their system libraries at the version package.json
# pins (scripts/browser-view-workflow.test.mjs keeps the two in step).
#
# NOC-175 slice 2: the same job runs the Rust SDK's key tests in IndexedDB
# in a dedicated worker in Chromium (scripts/sdk-keys/), which the gates
# skip in Node, which has no IndexedDB. They are built on the runner as the
# view's harness is, and run on pull requests that touch the SDK.
name: browser-view

on:
  pull_request:
    paths:
      - "crates/ncdb-core/**"
      - "crates/nocentraldb/**"
      - "scripts/browser-view/**"
      - "scripts/sdk-keys/**"
      - ".github/workflows/browser-view.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Playwright's image at the pinned playwright version, by digest.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27

concurrency:
  group: browser-view-${{ github.ref }}
  cancel-in-progress: true

jobs:
  view:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs proto, then moon, node and pnpm as pinned in .prototools.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-browser-view-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - run: pnpm install --frozen-lockfile

      # The harness for the browser and what the same code reads natively,
      # in target/browser-view (scripts/browser-view/build.mjs). As the root
      # script `gates` does: a CI checkout is shallow, so moon must not diff
      # against `main` to find what changed.
      - name: The harness, built on the runner
        run: |
          moon exec repo:wasm-runner --force --base HEAD --head HEAD
          node scripts/browser-view/build.mjs

      # The SDK's wasm32 library tests, in target/sdk-keys
      # (scripts/sdk-keys/build.mjs), served in the image by the
      # wasm-bindgen-test-runner the step above installed.
      - name: The SDK's key tests, built on the runner
        run: node scripts/sdk-keys/build.mjs

      # A registry that does not answer fails the pull in 4 minutes, and the
      # pull is tried once more.
      - name: Playwright's image, with a short timeout and one retry
        timeout-minutes: 10
        run: |
          for attempt in 1 2; do
            if timeout 240 docker pull "$PLAYWRIGHT_IMAGE"; then exit 0; fi
            echo "docker pull failed (attempt $attempt)"
            sleep 15
          done
          exit 1

      # The tests in the image, on the checkout and its node_modules, with
      # the harness built above.
      - name: The view in a worker in every engine
        run: >-
          docker run --rm --ipc=host
          -v "$PWD:/work" -w /work
          -e BROWSER_VIEW_PREBUILT=1
          "$PLAYWRIGHT_IMAGE"
          node --test 'scripts/browser-view/*.test.mjs'

      # The SDK's keys in IndexedDB, in a dedicated worker in Chromium; run
      # even when the view failed, so each reports on its own.
      - name: The SDK's keys in IndexedDB in Chromium
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --ipc=host
          -v "$PWD:/work" -w /work
          -e SDK_KEYS_PREBUILT=1
          "$PLAYWRIGHT_IMAGE"
          node --test 'scripts/sdk-keys/*.test.mjs'
