# The `changes` check: a pull request that changes a path outside the
# allowlist in scripts/release/check-fragments.mjs must add a fragment under
# changes/, unless it carries the label skip-changes. The label is read from
# the event payload, so labeled/unlabeled re-run the check. Read-only; the
# full history is fetched so the merge base with the PR's base exists.
#
# Breaking-change detection: cargo-semver-checks compares the workspace
# crates with the PR's base commit, checked out as a worktree (action input
# `baseline-root`; `baseline-rev` would extract the base as an archive, which
# refuses the repository's symlink that points outside the tree), with
# `rust-toolchain: manual`, so it uses the toolchain rust-toolchain.toml pins,
# installed by the step before it. It may fail without failing the job, so
# the fragment step still runs and turns its finding into a requirement; a
# warning then says that a failure without a failed lint is the tool's own
# and wants a re-run, not a breaking fragment. The TypeScript API report is
# diffed against the base's committed report (exit 3: a removed or changed
# line). Either finding adds --require-breaking, which the skip-changes
# label never waives.
# scripts/changes-workflow.test.mjs asserts these rules.
name: changes

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The toolchain from an exact-key cache; see ci.yml.
      - name: Cache the proto toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.proto/bin
            ~/.proto/shims
            ~/.proto/tools
            ~/.proto/plugins
          key: proto-${{ runner.os }}-${{ hashFiles('.prototools', 'scripts/install-toolchain.sh') }}
      - name: Install proto and the tools in .prototools
        run: bash scripts/install-toolchain.sh
      - run: pnpm install --frozen-lockfile
      - name: Base for the Rust API
        id: base-worktree
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/baseline" "$BASE"
      - run: rustup toolchain install --no-self-update
      # Only the publishable crates the base also has: a crate new in the
      # pull request has no baseline, and the tool's failure on it would read
      # as a breaking change (NOC-253).
      - name: Crates with a baseline
        id: packages
        run: node scripts/release/semver-packages.mjs --baseline "$RUNNER_TEMP/baseline" >> "$GITHUB_OUTPUT"
      - name: Rust API against the base
        id: semver
        if: steps.packages.outputs.any == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          baseline-root: ${{ runner.temp }}/baseline
          rust-toolchain: manual
          package: ${{ steps.packages.outputs.packages }}
        continue-on-error: true
      - name: Explain a failed semver step
        id: semver-failed
        if: steps.semver.outcome == 'failure'
        run: 'echo "::warning title=cargo-semver-checks failed::Its log above shows which item broke. If it shows no failed lint, the tool itself failed (a download or build error): re-run the job instead of adding a breaking fragment."'
      - name: TypeScript API against the base
        id: api
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          node scripts/release/api-report.mjs --base "$BASE"
          code=$?
          set -e
          echo "breaking=$([ "$code" = 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 3 ]
      - name: Required fragment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changes') && '--skip' || '' }}
          BREAKING: ${{ (steps.semver.outcome == 'failure' || steps.api.outputs.breaking == 'true') && '--require-breaking' || '' }}
        run: node scripts/release/check-fragments.mjs --base "$BASE" --head "$HEAD" $SKIP $BREAKING
