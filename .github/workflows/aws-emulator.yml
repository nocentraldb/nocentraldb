# NOC-275: runs the coverage check of the AWS Emulator, what it covers of
# the operations RFC 0007's AWS backend needs, against one pinned emulator
# version (NOC-264 point 2). It installs the emulator's signed Debian
# package from downloads.aws.com, checks its signature against the AWS key
# whose fingerprint the emulator's docs give, starts it with telemetry off,
# and runs crates/ncdb-relay-aws's ignored test against it. The table of
# results is the job's summary. It runs on pull requests that touch that
# crate or this file, and by hand. It is not part of `pnpm gates`, which
# runs without the emulator. docs/aws-emulator.md says how to run the same
# locally.
#
# No AWS credentials exist in this job: the emulator writes its own, and
# the test refuses an endpoint that is not a loopback address.
name: aws-emulator

on:
  pull_request:
    paths:
      - "crates/ncdb-relay-aws/**"
      - ".github/workflows/aws-emulator.yml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The pinned emulator: the version in the package's file name, and the
  # SHA-256 of that package, so a republished file cannot slip in.
  EMULATOR_VERSION: "1.0.336"
  EMULATOR_SHA256: "e2c621ec12c8a4bb46c884792d72f189378ea83ffcce180dc837b4c5e6b97f1c"
  # The AWS key that signs the package, as the emulator's docs give it.
  AWS_KEY_FINGERPRINT: "98BCF336A3BE53B734E967C52E5BF49BD940F624"
  # Nothing about these runs leaves the runner.
  EMULATOR_TELEMETRY: "off"

concurrency:
  group: aws-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-aws-emulator-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Download and verify the pinned emulator
        run: |
          base=https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS
          file="aws-emulator_${EMULATOR_VERSION}-1_amd64.deb"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/$file.sig"
          echo "$EMULATOR_SHA256  $file" | sha256sum -c -
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          curl -fsSLo aws-publishing.asc https://downloads.aws.com/keys/gpg/current.asc
          gpg --batch --import aws-publishing.asc
          gpg --batch --with-colons --fingerprint ssm-publishing@amazon.com \
            | grep -q "^fpr:::::::::${AWS_KEY_FINGERPRINT}:"
          gpg --batch --verify "$file.sig" "$file"
          sudo apt-get install -y "./$file"
          aws-emulator -v

      - name: Start the emulator, telemetry off
        run: |
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
          nohup aws-emulator --telemetry off > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for i in $(seq 60); do
            curl -sf --cacert ~/.aws/emulator/9297/ca.pem https://127.0.0.1:9297/__admin/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1

      - name: Run the coverage check
        env:
          AWS_ENDPOINT_URL: https://127.0.0.1:9297
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DISABLE_HOST_PREFIX_INJECTION: "true"
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          export AWS_SHARED_CREDENTIALS_FILE=~/.aws/emulator/9297/emulator_credentials
          export AWS_CONFIG_FILE=~/.aws/emulator/9297/config
          export SSL_CERT_FILE=~/.aws/emulator/9297/ca.pem
          export NCDB_EMULATOR_REPORT="$RUNNER_TEMP/coverage.md"
          cargo test --locked -p ncdb-relay-aws --test emulator_coverage -- --ignored --nocapture
          {
            echo "## AWS Emulator $EMULATOR_VERSION"
            echo
            cat "$NCDB_EMULATOR_REPORT"
          } >> "$GITHUB_STEP_SUMMARY"
