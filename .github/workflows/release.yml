# Releases. The alpha job turns every product-changing merge to main into a
# tagged GitHub prerelease once `ci` is green; the publish jobs (verify,
# build, publish, commit-back) react to beta and release tags. Every decision
# is in scripts/release/*.mjs with tests; this file only wires them. A
# workflow_dispatch is ALWAYS a dry run: nothing is tagged or published.
# Without a tag it runs the alpha job; with a tag, verify and build against
# the dispatched ref. scripts/release-workflow.test.mjs asserts these rules.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish dry run: check this tag name against the dispatched ref. Leave empty for an alpha dry run."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  alpha:
    # Only a green ci run of a push to this repository's main — never a run
    # that a pull request (a fork's included) triggered, since this job holds
    # contents: write. A dispatch with no tag is the dry run.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-alpha
      cancel-in-progress: false
    # bash runs with -eo pipefail, so a failing script piped into tee fails
    # its step (the default shell has no pipefail).
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      # Runs before any checkout, with the runner's own git, so nothing from
      # the commit under test executes before it is known to be the head of
      # main. Two merges in quick succession: the older one is skipped here,
      # and the next alpha covers it (alpha notes are computed since the
      # previous alpha tag, not per merge). The repository is public, so
      # ls-remote would work without a token; git authenticates with the
      # job's token anyway, so the guard does not depend on the repository's
      # visibility. A failing ls-remote, or no main at all (--exit-code),
      # fails the job instead of skipping it. A dry run on any ref but main
      # fails here: its commit is never the head of main, so it would skip
      # every step and end green, proving nothing. The
      # runner masks GH_TOKEN but not the header derived from it, so the
      # header is masked before git sees it.
      - name: Still the head of main?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a dry run proves the alpha job only on main; this is $GITHUB_REF (dispatch it with --ref main)"
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: basic $auth"
          head="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$head" != "$SHA" ]; then
            echo "::notice::$SHA is no longer the head of main ($head); the next alpha covers it"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$SHA is the head of main"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          fetch-tags: true
          # The job's write token stays out of .git/config, where the
          # dependency install below could read it; only the release step
          # gets it, as GH_TOKEN.
          persist-credentials: false
      # The toolchain from an exact-key cache; see ci.yml.
      - if: steps.guard.outputs.skip != 'true'
        name: Cache the proto toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.proto/bin
            ~/.proto/shims
            ~/.proto/tools
            ~/.proto/plugins
          key: proto-${{ runner.os }}-${{ hashFiles('.prototools', 'scripts/install-toolchain.sh') }}
      - if: steps.guard.outputs.skip != 'true'
        name: Install proto and the tools in .prototools
        run: bash scripts/install-toolchain.sh
      - if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Next version
        id: next
        if: steps.guard.outputs.skip != 'true'
        run: |
          node scripts/release/next-version.mjs --json | tee next.json
          {
            echo "skip=$(jq -r '.skip' next.json)"
            echo "tag=$(jq -r '.tag // ""' next.json)"
            echo "previous=$(jq -r '.previousAlpha // "none"' next.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Alpha notes
        if: steps.guard.outputs.skip != 'true' && steps.next.outputs.skip != 'true'
        run: node scripts/release/render-notes.mjs --alpha --since "$PREVIOUS" --repo "$GITHUB_REPOSITORY" | tee alpha-notes.md
        env:
          PREVIOUS: ${{ steps.next.outputs.previous }}
      # One act: the API creates the tag on $SHA together with the release.
      # A failed create leaves no tag behind, so a re-run computes the same
      # alpha again instead of skipping on an orphan tag; after a successful
      # create, a re-run finds the release and creates nothing. A tag that
      # exists on the remote without a release is refused: gh release create
      # would attach the release to it and ignore --target.
      - name: Tag and publish the alpha
        if: steps.guard.outputs.skip != 'true' && steps.next.outputs.skip != 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists, not re-creating"
          else
            existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" | jq -r --arg ref "refs/tags/$TAG" '.[] | select(.ref == $ref) | .ref')"
            if [ -n "$existing" ]; then
              echo "::error::tag $TAG exists on the remote without a release, and a release would attach to it instead of $SHA; delete the tag if it is an orphan, then re-run"
              exit 1
            fi
            gh release create "$TAG" --target "$SHA" --prerelease --title "$TAG" --notes-file alpha-notes.md
          fi

  verify:
    # Beta and release tags, or a dispatch that names a tag (the dry run, on
    # the dispatched ref). Read-only: it inherits contents: read.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-alpha.'))
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One group for every job of the publish side, per ref: two runs of one
    # tag (a re-run while one is in flight) never run two of these jobs at
    # once, so they never overlap in publish or commit-back. A running job is
    # never cancelled; GitHub still cancels an older PENDING job of the group
    # when a newer one queues, which leaves that run unfinished and the newer
    # run doing the whole work.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      stage: ${{ steps.verify.outputs.stage }}
      version: ${{ steps.verify.outputs.version }}
      last_beta: ${{ steps.verify.outputs.last_beta }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
      tag: ${{ env.TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # The toolchain from an exact-key cache; see ci.yml.
      - name: Cache the proto toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.proto/bin
            ~/.proto/shims
            ~/.proto/tools
            ~/.proto/plugins
          key: proto-${{ runner.os }}-${{ hashFiles('.prototools', 'scripts/install-toolchain.sh') }}
      - name: Install proto and the tools in .prototools
        run: bash scripts/install-toolchain.sh
      - run: rustup toolchain install --no-self-update
      - run: pnpm install --frozen-lockfile
      # verify-tag reads the release branch as origin/release/X.Y, which a
      # tag checkout does not fetch. On a push, GITHUB_SHA is the tagged
      # commit; on a dispatch, the head of the dispatched ref.
      - name: Verify the tag
        id: verify
        run: |
          git fetch origin '+refs/heads/release/*:refs/remotes/origin/release/*'
          node scripts/release/verify-tag.mjs --tag "$TAG" --commit "$GITHUB_SHA" --json | tee verify.json
          {
            echo "stage=$(jq -r '.stage' verify.json)"
            echo "version=$(jq -r '.version' verify.json)"
            echo "last_beta=$(jq -r '.lastBeta // "none"' verify.json)"
          } >> "$GITHUB_OUTPUT"
      # The full gate on the tagged commit itself: ci does not run on pushes
      # to release branches, and the tag may sit on a commit no PR ran.
      - run: pnpm gates

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain from an exact-key cache; see ci.yml.
      - name: Cache the proto toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.proto/bin
            ~/.proto/shims
            ~/.proto/tools
            ~/.proto/plugins
          key: proto-${{ runner.os }}-${{ hashFiles('.prototools', 'scripts/install-toolchain.sh') }}
      - name: Install proto and the tools in .prototools
        run: bash scripts/install-toolchain.sh
      - run: rustup toolchain install --no-self-update
      - run: pnpm install --frozen-lockfile
      # The tag is vX.Y.Z or vX.Y.Z-beta.N; the version to embed drops the v.
      # set-version refreshes Cargo.lock, so the --locked build passes.
      - name: Write the full version into this checkout
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: node scripts/release/set-version.mjs "${TAG#v}"
      - run: cargo build --release --locked
      - run: pnpm -r --if-present run build
      - name: Publishable packages
        run: node scripts/release/publishable.mjs --json | tee publishable.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifests-${{ needs.verify.outputs.tag }}
          path: |
            Cargo.toml
            Cargo.lock
            packages/*/package.json
            publishable.json

  publish:
    needs: [verify, build]
    # A dispatch is a dry run: it ends after build.
    if: needs.verify.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # The job's write token stays out of .git/config, where the
          # dependency install below could read it; only the release step
          # gets it, as GH_TOKEN.
          persist-credentials: false
      # The toolchain from an exact-key cache; see ci.yml.
      - name: Cache the proto toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.proto/bin
            ~/.proto/shims
            ~/.proto/tools
            ~/.proto/plugins
          key: proto-${{ runner.os }}-${{ hashFiles('.prototools', 'scripts/install-toolchain.sh') }}
      - name: Install proto and the tools in .prototools
        run: bash scripts/install-toolchain.sh
      - run: pnpm install --frozen-lockfile
      - name: Release notes
        env:
          STAGE: ${{ needs.verify.outputs.stage }}
          VERSION: ${{ needs.verify.outputs.version }}
          LAST_BETA: ${{ needs.verify.outputs.last_beta }}
        run: |
          if [ "$STAGE" = beta ]; then
            node scripts/release/render-notes.mjs --beta "$VERSION" --since "$LAST_BETA" > notes.md
          else
            node scripts/release/render-notes.mjs --release "$VERSION" > notes.md
          fi
          cat notes.md
      # A re-run after a successful create finds the release and creates
      # nothing; --verify-tag refuses to create a tag the push did not make.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          STAGE: ${{ needs.verify.outputs.stage }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists, not re-creating"
          elif [ "$STAGE" = beta ]; then
            gh release create "$TAG" --prerelease --verify-tag --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --latest --verify-tag --title "$TAG" --notes-file notes.md
          fi
      # Registry publishing is not wired yet: these steps never publish. They
      # report what publishable says, "would publish" or "skip <reason>". The
      # registry commands come with Trusted Publishing, once the owner has
      # published each package by hand (docs/release-management.md, "A new
      # package's first publish"), and change the permissions check with them.
      - name: npm
        run: |
          node scripts/release/publishable.mjs --json \
            | jq -r '.npm[] | if .publishable then "would publish \(.name)" else "skip \(.name): \(.reason)" end'
      - name: crates.io
        run: |
          node scripts/release/publishable.mjs --json \
            | jq -r '.crates[] | if .publishable then "would publish \(.name)" else "skip \(.name): \(.reason)" end'

  commit-back:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    # No permissions block: the job's github.token keeps the workflow's
    # contents: read. The push goes through the release app's token below.
    defaults:
      run:
        shell: bash
    steps:
      # The ruleset "Require PR" on main lets only the organization's release
      # GitHub App push without a pull request (docs/release-management.md,
      # "The bypass for commit-back"). This step mints a token for that app,
      # for this repository only and with contents: write only; it expires
      # after an hour and is revoked when the job ends.
      # scripts/release-ruleset.test.mjs holds this job to that token; the
      # only other job that mints it is the read-only app-token-check of a
      # dispatch.
      - name: Release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          # As in publish: the token is not left in .git/config; the commit
          # step below hands it to git for the push only.
          persist-credentials: false
      # The toolchain from an exact-key cache; see ci.yml.
      - name: Cache the proto toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.proto/bin
            ~/.proto/shims
            ~/.proto/tools
            ~/.proto/plugins
          key: proto-${{ runner.os }}-${{ hashFiles('.prototools', 'scripts/install-toolchain.sh') }}
      - name: Install proto and the tools in .prototools
        run: bash scripts/install-toolchain.sh
      - run: pnpm install --frozen-lockfile
      # The push passes the ruleset "Require PR" on main only because the
      # release app is on its bypass list, an owner setting; it opens no
      # pull request. Unlike a push with github.token, a push with the app's
      # token starts ci on main, which runs the gate on the commit (index
      # test, fragment schema; commit-back.mjs checks both before it commits
      # too). The commit adds no fragment, so it brings no alpha of its own
      # (next-version, N3).
      # The index date is the UTC day the GitHub release was published, read
      # from the release, so a re-run on a later day (or a run that crosses
      # midnight) indexes the same day and finds nothing to commit.
      - name: Index, notes archive and shipped fragments to main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          STAGE: ${{ needs.verify.outputs.stage }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: basic $auth"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PUBLISHED="$(gh release view "$TAG" --json publishedAt --jq '.publishedAt[:10]')"
          node scripts/release/commit-back.mjs --tag "$TAG" --stage "$STAGE" --version "$VERSION" --date "$PUBLISHED"

  app-token-check:
    # Every workflow_dispatch, the dry run of either side, also proves the
    # release app's setup before the first beta needs it: the Client ID
    # variable and the private key secret exist, and the token commit-back
    # pushes with can be minted for this repository. It mints that token
    # exactly as commit-back does and only reads with it; it checks out no
    # code and writes nothing. Whether the ruleset lets the app's push
    # through is proven only by the first real commit-back
    # (docs/release-management.md, "The bypass for commit-back").
    # scripts/release-ruleset.test.mjs asserts these rules.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      # Sees only whether the secret is set, never its value.
      - name: Release app settings exist
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          missing=0
          if [ -z "$RELEASE_APP_CLIENT_ID" ]; then
            echo "::error::the repository variable RELEASE_APP_CLIENT_ID is not set: add the release app's Client ID (docs/release-management.md, \"The bypass for commit-back\")"
            missing=1
          fi
          if [ "$HAS_PRIVATE_KEY" != true ]; then
            echo "::error::the repository secret RELEASE_APP_PRIVATE_KEY is not set: add the release app's private key (docs/release-management.md, \"The bypass for commit-back\")"
            missing=1
          fi
          exit "$missing"
      - name: Release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # Read-only: the token must be the app nocentraldb-release's, and the
      # repositories it reaches must include this one.
      - name: The token reaches this repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [ "$APP_SLUG" != nocentraldb-release ]; then
            echo "::error::the token is app $APP_SLUG's, not nocentraldb-release's: RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY belong to another app"
            exit 1
          fi
          repos="$(gh api installation/repositories --paginate --jq '.repositories[].full_name')"
          if ! grep -qxF "$GITHUB_REPOSITORY" <<< "$repos"; then
            echo "::error::the token of app $APP_SLUG does not reach $GITHUB_REPOSITORY; install the app on it"
            exit 1
          fi
          echo "app $APP_SLUG: token minted with contents: write, reaches $GITHUB_REPOSITORY; the ruleset bypass is proven only by the first real commit-back push"
