<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img" aria-labelledby="rfc-0001-two-spaces-title rfc-0001-two-spaces-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="rfc-0001-two-spaces-title">Only the members of Project A receive the change</title>
  <desc id="rfc-0001-two-spaces-desc">Bob's phone pushes a change to Project A's log on the relay; the relay sends it to Agent X, a cloud function and Alice's laptop, the other members of Project A; Carol is a member of HR only, receives nothing from Project A and has no key to read it.</desc>
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .ac { fill: #0969da; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; }
    .plain { fill: #ffffff; stroke: #d1d9e0; }
    .focal { fill: #ddf4ff; stroke: #0969da; }
    .zone { fill: none; stroke: #d1d9e0; }
    .zonea { fill: #0969da; fill-opacity: 0.05; stroke: #0969da; }
    .frame { fill: #f6f8fa; stroke: #d1d9e0; }
    .life { stroke: #d1d9e0; }
    .ln { stroke: #59636e; fill: none; }
    .lna { stroke: #0969da; fill: none; }
    .mk { fill: #59636e; }
    .mka { fill: #0969da; }
    .mask { fill: #ffffff; }
    .num { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .ac { fill: #4493f8; }
      .box { fill: #161b22; stroke: #3d444d; }
      .plain { fill: #0d1117; stroke: #3d444d; }
      .focal { fill: #0c2d4a; stroke: #4493f8; }
      .zone { stroke: #3d444d; }
      .zonea { fill: #4493f8; fill-opacity: 0.08; stroke: #4493f8; }
      .frame { fill: #161b22; stroke: #3d444d; }
      .life { stroke: #3d444d; }
      .ln { stroke: #9198a1; }
      .lna { stroke: #4493f8; }
      .mk { fill: #9198a1; }
      .mka { fill: #4493f8; }
      .mask { fill: #0d1117; }
      .num { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="rfc-0001-two-spaces-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mk"/></marker>
    <marker id="rfc-0001-two-spaces-ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mka"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="880" height="392"/>
  <rect class="zonea" x="24" y="176" width="592" height="196" rx="8"/>
  <rect class="zone" x="472" y="168" width="384" height="212" rx="8" stroke-dasharray="6,4"/>
  <text x="40" y="198" class="ac" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">SPACE PROJECT A</text>
  <text x="840" y="190" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end">SPACE HR</text>
  <path d="M104,236 L104,92 Q104,84 112,84 L200,84" class="ln" stroke-width="1.3" marker-end="url(#rfc-0001-two-spaces-m)"/>
  <rect class="mask" x="84.8" y="148" width="38.4" height="18"/>
  <text x="104" y="160" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">PUSH</text>
  <path d="M264,128 L264,236" class="lna" stroke-width="1.6" marker-end="url(#rfc-0001-two-spaces-ma)"/>
  <rect class="mask" x="234.9" y="150" width="58.199999999999996" height="18"/>
  <text x="264" y="162" class="ac" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">ENTRIES</text>
  <path d="M400,128 L400,236" class="lna" stroke-width="1.6" marker-end="url(#rfc-0001-two-spaces-ma)"/>
  <path d="M540,128 L540,236" class="lna" stroke-width="1.6" marker-end="url(#rfc-0001-two-spaces-ma)"/>
  <rect class="plain" x="200" y="20" width="480" height="108" rx="6"/>
  <text x="214" y="42" class="t" font-size="14" font-weight="600">Relay</text>
  <text x="216" y="70" class="t" font-size="12.5" font-weight="600">Project A's log</text>
  <text x="216" y="90" class="ac" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">▮ ▮ ▮ ▮ + the new change</text>
  <text x="472" y="70" class="t" font-size="12.5" font-weight="600">HR's log</text>
  <text x="472" y="90" class="m" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">▮ ▮ ▮  unchanged</text>
  <rect class="plain" x="44" y="236" width="124" height="112" rx="6"/>
  <text x="58" y="258" class="t" font-size="14" font-weight="600">Bob's phone</text>
  <text x="58" y="278" class="m" font-size="12.5">writes the</text>
  <text x="58" y="296" class="m" font-size="12.5">change</text>
  <rect class="plain" x="200" y="236" width="128" height="112" rx="6"/>
  <text x="214" y="258" class="t" font-size="14" font-weight="600">Agent X</text>
  <text x="214" y="278" class="m" font-size="12.5">decrypts</text>
  <text x="214" y="296" class="m" font-size="12.5">and folds</text>
  <rect class="plain" x="336" y="236" width="128" height="112" rx="6"/>
  <text x="350" y="258" class="t" font-size="13.5" font-weight="600">Cloud function</text>
  <text x="350" y="278" class="m" font-size="12.5">decrypts</text>
  <text x="350" y="296" class="m" font-size="12.5">and folds</text>
  <rect class="focal" x="484" y="236" width="112" height="112" rx="6"/>
  <text x="498" y="258" class="t" font-size="13.5" font-weight="600">Alice's laptop</text>
  <text x="498" y="278" class="m" font-size="12.5">in both spaces;</text>
  <text x="498" y="296" class="m" font-size="12.5">decrypts</text>
  <text x="498" y="314" class="m" font-size="12.5">and folds</text>
  <rect class="box" x="640" y="236" width="196" height="112" rx="6"/>
  <text x="654" y="258" class="t" font-size="14" font-weight="600">Carol</text>
  <text x="654" y="278" class="m" font-size="12.5">member of HR only:</text>
  <text x="654" y="296" class="m" font-size="12.5">receives nothing from</text>
  <text x="654" y="314" class="m" font-size="12.5">Project A, holds no key</text>
  <text x="654" y="332" class="m" font-size="12.5">to read it</text>
</svg>
