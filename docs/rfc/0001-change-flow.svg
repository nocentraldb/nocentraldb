<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How one change travels: Bob writes in space Project A; the relay stores it encrypted; only the members of Project A receive and read it; a member of another space receives nothing</title>
  <style>
    .bg { fill: #ffffff; }
    .lane { fill: #f6f8fa; stroke: #d1d9e0; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .box { fill: #ffffff; stroke: #d1d9e0; }
    .pa { fill: #ddf4ff; stroke: #0969da; }
    .paf { fill: #0969da; }
    .pas { stroke: #0969da; }
    .hr { fill: #fff8c5; stroke: #9a6700; }
    .relay { fill: #fbefff; stroke: #8250df; }
    .no { fill: #f6f8fa; stroke: #d1d9e0; }
    .nof { fill: #cf222e; }
    .nos { stroke: #cf222e; }
    .arrow { stroke: #59636e; fill: none; }
    .ah { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .lane { fill: #161b22; stroke: #3d444d; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .box { fill: #0d1117; stroke: #3d444d; }
      .pa { fill: #0c2d4a; stroke: #4493f8; }
      .paf { fill: #4493f8; }
      .pas { stroke: #4493f8; }
      .hr { fill: #2e2a14; stroke: #d29922; }
      .relay { fill: #2a1a3d; stroke: #ab7df8; }
      .no { fill: #161b22; stroke: #3d444d; }
      .nof { fill: #f85149; }
      .nos { stroke: #f85149; }
      .arrow { stroke: #9198a1; }
      .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="paf"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="640"/>
  <text class="t" x="24" y="38" font-size="22" font-weight="600">How one change travels</text>
  <text class="m" x="24" y="60" font-size="13">Two spaces: "Project A" (blue) and "HR" (yellow). Alice is in both, Carol only in HR. Bob changes a task in Project A.</text>

  <!-- writer -->
  <rect class="pa" x="24" y="200" width="270" height="200" rx="8"/>
  <text class="t" x="40" y="226" font-size="15" font-weight="700">Bob's phone</text>
  <text class="m" x="40" y="246" font-size="12">member of Project A</text>
  <text class="t" x="40" y="276" font-size="12.5">1. writes locally, the view</text>
  <text class="t" x="40" y="294" font-size="12.5">updates at once</text>
  <text class="t" x="40" y="320" font-size="12.5">2. signs the change with</text>
  <text class="t" x="40" y="338" font-size="12.5">Bob's own key</text>
  <text class="t" x="40" y="364" font-size="12.5">3. encrypts it with the key</text>
  <text class="t" x="40" y="382" font-size="12.5">of Project A</text>

  <!-- relay -->
  <rect class="relay" x="380" y="120" width="360" height="400" rx="8"/>
  <text class="t" x="396" y="146" font-size="15" font-weight="700">Relay</text>
  <text class="m" x="396" y="166" font-size="12">holds no keys</text>
  <text class="t" x="396" y="192" font-size="12.5">4. checks Bob's signature and that</text>
  <text class="t" x="396" y="210" font-size="12.5">Bob is a member of Project A</text>
  <text class="t" x="396" y="236" font-size="12.5">5. appends the ciphertext to the log</text>
  <text class="t" x="396" y="254" font-size="12.5">of Project A</text>

  <rect class="pa" x="396" y="276" width="328" height="64" rx="6"/>
  <text class="t" x="410" y="300" font-size="13" font-weight="600">Log of Project A</text>
  <text class="m" x="410" y="320" font-size="12">… ▮ ▮ ▮ ▮ new change (ciphertext)</text>
  <rect class="hr" x="396" y="352" width="328" height="64" rx="6"/>
  <text class="t" x="410" y="376" font-size="13" font-weight="600">Log of HR</text>
  <text class="m" x="410" y="396" font-size="12">… ▮ ▮ ▮ unchanged</text>

  <text class="m" x="396" y="446" font-size="12">It sees only metadata: which key wrote</text>
  <text class="m" x="396" y="464" font-size="12">to which space, when and how much.</text>
  <text class="m" x="396" y="488" font-size="12">A copy of its database is ciphertext only.</text>

  <path class="pas" d="M294,300 L392,300" stroke-width="2.5" fill="none" marker-end="url(#b)"/>

  <!-- receivers -->
  <rect class="lane" x="800" y="80" width="384" height="540" rx="8"/>
  <text class="t" x="816" y="104" font-size="14" font-weight="600">6. Every member of Project A receives it</text>

  <rect class="pa" x="816" y="120" width="352" height="96" rx="6"/>
  <text class="t" x="830" y="144" font-size="14" font-weight="600">Alice's laptop</text>
  <text class="m" x="960" y="144" font-size="12">Project A and HR</text>
  <text class="t" x="830" y="168" font-size="12.5">decrypts, checks Bob's signature, folds;</text>
  <text class="t" x="830" y="186" font-size="12.5">her task list re-ranks, a subscription</text>
  <text class="t" x="830" y="204" font-size="12.5">shows a notification</text>

  <rect class="pa" x="816" y="228" width="352" height="84" rx="6"/>
  <text class="t" x="830" y="252" font-size="14" font-weight="600">Agent X</text>
  <text class="m" x="900" y="252" font-size="12">Project A only, own key and role</text>
  <text class="t" x="830" y="276" font-size="12.5">its local "ready" view changes; it picks</text>
  <text class="t" x="830" y="294" font-size="12.5">the next task without a network call</text>

  <rect class="pa" x="816" y="324" width="352" height="96" rx="6"/>
  <text class="t" x="830" y="348" font-size="14" font-weight="600">Cloud function</text>
  <text class="m" x="950" y="348" font-size="12">member of Project A</text>
  <text class="t" x="830" y="372" font-size="12.5">gets the change through the AWS adapter,</text>
  <text class="t" x="830" y="390" font-size="12.5">decrypts it and starts an agent only if</text>
  <text class="t" x="830" y="408" font-size="12.5">a subscription matches</text>

  <rect class="no" x="816" y="448" width="352" height="96" rx="6" stroke-dasharray="5 4"/>
  <text class="t" x="830" y="472" font-size="14" font-weight="600">Carol, HR lead</text>
  <text class="m" x="944" y="472" font-size="12">HR only</text>
  <text class="t" x="830" y="496" font-size="12.5">receives nothing from Project A and has</text>
  <text class="t" x="830" y="514" font-size="12.5">no key to read it. Her copy of HR is</text>
  <text class="t" x="830" y="532" font-size="12.5">unaffected.</text>

  <path class="pas" d="M740,308 C770,308 780,168 812,168" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path class="pas" d="M740,308 C772,308 784,270 812,270" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path class="pas" d="M740,308 C772,308 784,372 812,372" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path class="nos" d="M740,308 C776,308 778,496 812,496" stroke-width="1.5" fill="none" stroke-dasharray="3 5"/>
  <line class="nos" x1="768" y1="436" x2="786" y2="454" stroke-width="2"/>
  <line class="nos" x1="786" y1="436" x2="768" y2="454" stroke-width="2"/>

  <text class="m" x="24" y="572" font-size="12.5">The same set of changes produces the same state on every member, in any order of arrival.</text>
  <text class="m" x="24" y="592" font-size="12.5">If the relay is unreachable, Bob keeps working; members on one network exchange changes directly,</text>
  <text class="m" x="24" y="612" font-size="12.5">and all copies converge when the relay is back.</text>
</svg>
