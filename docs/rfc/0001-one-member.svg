<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-labelledby="rfc-0001-one-member-title rfc-0001-one-member-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="rfc-0001-one-member-title">Every member runs the same core</title>
  <desc id="rfc-0001-one-member-desc">On every member, your app or agent sits on a TypeScript or Rust SDK, which sits on the core: an encrypted log of each space the member belongs to, folded into a local SQLite view that queries read through declared indexes, with field types as plugins; the core reads model.lock.json.</desc>
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .ac { fill: #0969da; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; }
    .plain { fill: #ffffff; stroke: #d1d9e0; }
    .focal { fill: #ddf4ff; stroke: #0969da; }
    .zone { fill: none; stroke: #d1d9e0; }
    .zonea { fill: #0969da; fill-opacity: 0.05; stroke: #0969da; }
    .frame { fill: #f6f8fa; stroke: #d1d9e0; }
    .life { stroke: #d1d9e0; }
    .ln { stroke: #59636e; fill: none; }
    .lna { stroke: #0969da; fill: none; }
    .mk { fill: #59636e; }
    .mka { fill: #0969da; }
    .mask { fill: #ffffff; }
    .num { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .ac { fill: #4493f8; }
      .box { fill: #161b22; stroke: #3d444d; }
      .plain { fill: #0d1117; stroke: #3d444d; }
      .focal { fill: #0c2d4a; stroke: #4493f8; }
      .zone { stroke: #3d444d; }
      .zonea { fill: #4493f8; fill-opacity: 0.08; stroke: #4493f8; }
      .frame { fill: #161b22; stroke: #3d444d; }
      .life { stroke: #3d444d; }
      .ln { stroke: #9198a1; }
      .lna { stroke: #4493f8; }
      .mk { fill: #9198a1; }
      .mka { fill: #4493f8; }
      .mask { fill: #0d1117; }
      .num { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="rfc-0001-one-member-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mk"/></marker>
    <marker id="rfc-0001-one-member-ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mka"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="880" height="500"/>
  <text x="40" y="28" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">ON EVERY MEMBER: A BROWSER, A PHONE, A LAPTOP, AN AGENT, A CLOUD FUNCTION</text>
  <rect class="plain" x="40" y="48" width="560" height="64" rx="6"/>
  <text x="54" y="70" class="t" font-size="14" font-weight="600">Your app or agent</text>
  <text x="54" y="90" class="m" font-size="12.5">reads from the local view, writes changes, subscribes to changes</text>
  <rect class="plain" x="40" y="128" width="560" height="64" rx="6"/>
  <text x="54" y="150" class="t" font-size="14" font-weight="600">SDK</text>
  <text x="54" y="170" class="m" font-size="12.5">TypeScript @nocentraldb/sdk or Rust nocentraldb; it manages the keys</text>
  <rect class="box" x="40" y="208" width="560" height="276" rx="6"/>
  <text x="54" y="226" class="m" font-size="10" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">CORE</text>
  <text x="54" y="246" class="t" font-size="14" font-weight="600">ncdb-core</text>
  <text x="54" y="266" class="m" font-size="12.5">Rust, natively and as WebAssembly in the browser</text>
  <path d="M664,260 L602,260" class="ln" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#rfc-0001-one-member-m)"/>
  <path d="M284,340 L358,340" class="lna" stroke-width="1.6" marker-end="url(#rfc-0001-one-member-ma)"/>
  <rect class="mask" x="300.8" y="316" width="38.4" height="18"/>
  <text x="320" y="328" class="ac" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">FOLD</text>
  <rect class="plain" x="60" y="296" width="224" height="88" rx="6"/>
  <text x="74" y="318" class="t" font-size="14" font-weight="600">Encrypted log</text>
  <text x="74" y="338" class="m" font-size="12.5">the full log of every space</text>
  <text x="74" y="356" class="m" font-size="12.5">this member belongs to</text>
  <rect class="focal" x="360" y="296" width="220" height="88" rx="6"/>
  <text x="374" y="318" class="t" font-size="14" font-weight="600">Local SQLite view</text>
  <text x="374" y="338" class="m" font-size="12.5">reads never leave the device;</text>
  <text x="374" y="356" class="m" font-size="12.5">queries use declared indexes</text>
  <rect class="plain" x="60" y="400" width="520" height="64" rx="6"/>
  <text x="74" y="422" class="t" font-size="14" font-weight="600">Field types, as plugins</text>
  <text x="74" y="442" class="m" font-size="12.5">each declares how concurrent changes merge</text>
  <rect class="box" x="664" y="208" width="192" height="104" rx="6"/>
  <text x="678" y="230" class="t" font-size="14" font-weight="600">model.lock.json</text>
  <text x="678" y="250" class="m" font-size="12.5">built from the TypeScript</text>
  <text x="678" y="268" class="m" font-size="12.5">schema by ncdb model build;</text>
  <text x="678" y="286" class="m" font-size="12.5">the core and SDKs read it</text>
</svg>
