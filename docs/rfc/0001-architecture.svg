<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>NoCentralDB components: your app, the SDKs, the core on every member, field types as plugins, the relay that holds no keys, and adapters</title>
  <style>
    .bg { fill: #ffffff; }
    .lane { fill: #f6f8fa; stroke: #d1d9e0; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .box { fill: #ffffff; stroke: #d1d9e0; }
    .app { fill: #fff8c5; stroke: #9a6700; }
    .core { fill: #ddf4ff; stroke: #0969da; }
    .relay { fill: #fbefff; stroke: #8250df; }
    .plug { fill: #dafbe1; stroke: #1a7f37; }
    .arrow { stroke: #59636e; fill: none; }
    .ah { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .lane { fill: #161b22; stroke: #3d444d; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .box { fill: #0d1117; stroke: #3d444d; }
      .app { fill: #2e2a14; stroke: #d29922; }
      .core { fill: #0c2d4a; stroke: #4493f8; }
      .relay { fill: #2a1a3d; stroke: #ab7df8; }
      .plug { fill: #12261e; stroke: #3fb950; }
      .arrow { stroke: #9198a1; }
      .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text class="t" x="24" y="38" font-size="22" font-weight="600">Components</text>
  <text class="m" x="24" y="60" font-size="13">Every member, a device or an agent, runs the core with a full copy of its spaces. The relay in the middle only stores and forwards encrypted changes.</text>

  <!-- member lane -->
  <rect class="lane" x="16" y="78" width="740" height="600" rx="8"/>
  <text class="t" x="32" y="102" font-size="14" font-weight="600">On every member</text>
  <text class="m" x="32" y="120" font-size="12">a browser, a phone, a laptop, an agent, a cloud function</text>

  <rect class="app" x="32" y="136" width="440" height="64" rx="6"/>
  <text class="t" x="46" y="160" font-size="14" font-weight="600">Your app or agent</text>
  <text class="t" x="46" y="182" font-size="12.5">reads views, writes changes, subscribes to changes</text>

  <rect class="box" x="488" y="136" width="252" height="64" rx="6"/>
  <text class="t" x="502" y="160" font-size="14" font-weight="600">CLI ncdb</text>
  <text class="t" x="502" y="182" font-size="12.5">builds the schema, shows changes</text>

  <rect class="box" x="32" y="216" width="214" height="56" rx="6"/>
  <text class="t" x="46" y="240" font-size="14" font-weight="600">TypeScript SDK</text>
  <text class="m" x="46" y="259" font-size="12">@nocentraldb/sdk</text>
  <rect class="box" x="258" y="216" width="214" height="56" rx="6"/>
  <text class="t" x="272" y="240" font-size="14" font-weight="600">Rust SDK</text>
  <text class="m" x="272" y="259" font-size="12">nocentraldb</text>
  <line class="arrow" x1="252" y1="200" x2="252" y2="212" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="core" x="32" y="288" width="708" height="374" rx="8"/>
  <text class="t" x="48" y="314" font-size="15" font-weight="700">Core ncdb-core</text>
  <text class="m" x="168" y="314" font-size="12.5">Rust, runs natively and as WebAssembly in the browser</text>
  <line class="arrow" x1="252" y1="272" x2="252" y2="284" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="box" x="48" y="330" width="218" height="74" rx="6"/>
  <text class="t" x="60" y="352" font-size="13.5" font-weight="600">Schema</text>
  <text class="t" x="60" y="372" font-size="12">model.lock.json, built once</text>
  <text class="t" x="60" y="390" font-size="12">from the TypeScript model</text>

  <rect class="box" x="278" y="330" width="218" height="74" rx="6"/>
  <text class="t" x="290" y="352" font-size="13.5" font-weight="600">Keys and signatures</text>
  <text class="t" x="290" y="372" font-size="12">one key per space and member,</text>
  <text class="t" x="290" y="390" font-size="12">one per person for personal fields</text>

  <rect class="box" x="508" y="330" width="218" height="74" rx="6"/>
  <text class="t" x="520" y="352" font-size="13.5" font-weight="600">Encrypted log</text>
  <text class="t" x="520" y="372" font-size="12">every change of every space</text>
  <text class="t" x="520" y="390" font-size="12">this member belongs to</text>

  <rect class="box" x="48" y="418" width="448" height="74" rx="6"/>
  <text class="t" x="60" y="440" font-size="13.5" font-weight="600">Fold into a local SQLite view</text>
  <text class="t" x="60" y="460" font-size="12">indexes, views and computed fields update as changes arrive;</text>
  <text class="t" x="60" y="478" font-size="12">reads never leave the device, results come in rank order</text>

  <rect class="box" x="508" y="418" width="218" height="74" rx="6"/>
  <text class="t" x="520" y="440" font-size="13.5" font-weight="600">Subscriptions</text>
  <text class="t" x="520" y="460" font-size="12">call the app when a matching</text>
  <text class="t" x="520" y="478" font-size="12">change arrives</text>

  <rect class="plug" x="48" y="506" width="678" height="140" rx="6"/>
  <text class="t" x="60" y="530" font-size="13.5" font-weight="600">Field types: each declares how concurrent changes merge</text>
  <rect class="box" x="60" y="544" width="206" height="88" rx="6"/>
  <text class="t" x="72" y="566" font-size="13" font-weight="600">Basic</text>
  <text class="t" x="72" y="586" font-size="12">string, number, choice:</text>
  <text class="t" x="72" y="602" font-size="12">last writer wins; sets, links</text>
  <rect class="box" x="278" y="544" width="206" height="88" rx="6"/>
  <text class="t" x="290" y="566" font-size="13" font-weight="600">Shipped with NoCentralDB</text>
  <text class="t" x="290" y="586" font-size="12">rich text (Yjs), for editors</text>
  <text class="t" x="290" y="602" font-size="12">and agent edits; stream, for</text>
  <text class="t" x="290" y="618" font-size="12">answers chunk by chunk</text>
  <rect class="box" x="496" y="544" width="218" height="88" rx="6" stroke-dasharray="5 4"/>
  <text class="t" x="508" y="566" font-size="13" font-weight="600">Your own field type</text>
  <text class="t" x="508" y="586" font-size="12">a plugin with its own merge</text>
  <text class="t" x="508" y="602" font-size="12">rules, used in the schema next</text>
  <text class="t" x="508" y="618" font-size="12">to the built-in types</text>

  <!-- relay -->
  <rect class="lane" x="776" y="78" width="408" height="600" rx="8"/>
  <text class="t" x="792" y="102" font-size="14" font-weight="600">In the cloud</text>
  <text class="m" x="792" y="120" font-size="12">the relay holds no keys and reads no content</text>

  <rect class="relay" x="792" y="288" width="376" height="176" rx="8"/>
  <text class="t" x="808" y="314" font-size="15" font-weight="700">Relay</text>
  <text class="t" x="808" y="338" font-size="12.5">appends signed, encrypted changes to each</text>
  <text class="t" x="808" y="356" font-size="12.5">space's log and hands them out from a cursor</text>
  <text class="t" x="808" y="380" font-size="12.5">checks signatures and membership</text>
  <text class="t" x="808" y="404" font-size="12.5">sees metadata only: which key is in which</text>
  <text class="t" x="808" y="422" font-size="12.5">space, when and how much it writes</text>
  <text class="m" x="808" y="448" font-size="12">backends: SQLite, Postgres, DynamoDB with S3</text>

  <path class="arrow" d="M726,367 L788,367" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="m" x="736" y="358" font-size="11">encrypted</text>
  <text class="m" x="736" y="384" font-size="11">changes</text>

  <rect class="plug" x="792" y="506" width="376" height="140" rx="8"/>
  <text class="t" x="808" y="530" font-size="13.5" font-weight="600">Adapters, e.g. for AWS</text>
  <text class="t" x="808" y="552" font-size="12.5">connect a space's change stream to another</text>
  <text class="t" x="808" y="570" font-size="12.5">system. The AWS adapter feeds EventBridge;</text>
  <text class="t" x="808" y="588" font-size="12.5">a function that is a member of the space, with</text>
  <text class="t" x="808" y="606" font-size="12.5">its own key, decrypts, matches subscriptions</text>
  <text class="t" x="808" y="624" font-size="12.5">and starts an agent only on a match.</text>
  <line class="arrow" x1="980" y1="464" x2="980" y2="502" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="box" x="792" y="136" width="376" height="136" rx="8" stroke-dasharray="5 4"/>
  <text class="t" x="808" y="160" font-size="13.5" font-weight="600">A server that must read</text>
  <text class="t" x="808" y="182" font-size="12.5">Some features need a server that reads content,</text>
  <text class="t" x="808" y="200" font-size="12.5">such as rendering a page or sending an email</text>
  <text class="t" x="808" y="218" font-size="12.5">digest. It joins the spaces it needs as a regular</text>
  <text class="t" x="808" y="236" font-size="12.5">member with its own key, visible in the member</text>
  <text class="t" x="808" y="254" font-size="12.5">list, and runs the core like any other member.</text>
</svg>
