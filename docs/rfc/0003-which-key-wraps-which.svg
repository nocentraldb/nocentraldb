<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 668" width="880" height="668" role="img" aria-labelledby="rfc-0003-which-key-wraps-which-title rfc-0003-which-key-wraps-which-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="rfc-0003-which-key-wraps-which-title">Which key protects which</title>
  <desc id="rfc-0003-which-key-wraps-which-desc">The account key certifies member keys; a member's key receives each space key generation in a key envelope; a new generation encrypts the previous ones in the key chain, derives the content key and wraps the person keys; the content key encrypts a change's payload, the person key encrypts that person's personal fields inside it, and the member key signs the change.</desc>
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .ac { fill: #0969da; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; }
    .plain { fill: #ffffff; stroke: #d1d9e0; }
    .focal { fill: #ddf4ff; stroke: #0969da; }
    .zone { fill: none; stroke: #d1d9e0; }
    .zonea { fill: #0969da; fill-opacity: 0.05; stroke: #0969da; }
    .frame { fill: #f6f8fa; stroke: #d1d9e0; }
    .life { stroke: #d1d9e0; }
    .ln { stroke: #59636e; fill: none; }
    .lna { stroke: #0969da; fill: none; }
    .mk { fill: #59636e; }
    .mka { fill: #0969da; }
    .mask { fill: #ffffff; }
    .num { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .ac { fill: #4493f8; }
      .box { fill: #161b22; stroke: #3d444d; }
      .plain { fill: #0d1117; stroke: #3d444d; }
      .focal { fill: #0c2d4a; stroke: #4493f8; }
      .zone { stroke: #3d444d; }
      .zonea { fill: #4493f8; fill-opacity: 0.08; stroke: #4493f8; }
      .frame { fill: #161b22; stroke: #3d444d; }
      .life { stroke: #3d444d; }
      .ln { stroke: #9198a1; }
      .lna { stroke: #4493f8; }
      .mk { fill: #9198a1; }
      .mka { fill: #4493f8; }
      .mask { fill: #0d1117; }
      .num { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="rfc-0003-which-key-wraps-which-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mk"/></marker>
    <marker id="rfc-0003-which-key-wraps-which-ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mka"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="880" height="668"/>
  <path d="M136,128 L136,200" class="ln" stroke-width="1.3" marker-end="url(#rfc-0003-which-key-wraps-which-m)"/>
  <rect class="mask" x="100.3" y="156" width="71.4" height="18"/>
  <text x="136" y="168" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">CERTIFIES</text>
  <path d="M240,244 L334,244" class="ln" stroke-width="1.3" marker-end="url(#rfc-0003-which-key-wraps-which-m)"/>
  <rect class="mask" x="265.5" y="220" width="45" height="18"/>
  <text x="288" y="232" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">WRAPS</text>
  <path d="M440,200 L440,130" class="ln" stroke-width="1.3" marker-end="url(#rfc-0003-which-key-wraps-which-m)"/>
  <rect class="mask" x="407.6" y="156" width="64.8" height="18"/>
  <text x="440" y="168" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">ENCRYPTS</text>
  <path d="M544,244 L638,244" class="ln" stroke-width="1.3" marker-end="url(#rfc-0003-which-key-wraps-which-m)"/>
  <rect class="mask" x="569.5" y="220" width="45" height="18"/>
  <text x="592" y="232" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">WRAPS</text>
  <path d="M440,288 L440,358" class="ln" stroke-width="1.3" marker-end="url(#rfc-0003-which-key-wraps-which-m)"/>
  <rect class="mask" x="410.9" y="316" width="58.199999999999996" height="18"/>
  <text x="440" y="328" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">DERIVES</text>
  <path d="M440,448 L440,518" class="ln" stroke-width="1.3" marker-end="url(#rfc-0003-which-key-wraps-which-m)"/>
  <rect class="mask" x="407.6" y="476" width="64.8" height="18"/>
  <text x="440" y="488" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">ENCRYPTS</text>
  <path d="M744,288 L744,358" class="ln" stroke-width="1.3" marker-end="url(#rfc-0003-which-key-wraps-which-m)"/>
  <rect class="mask" x="711.6" y="316" width="64.8" height="18"/>
  <text x="744" y="328" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">ENCRYPTS</text>
  <path d="M744,448 L744,556 Q744,564 736,564 L546,564" class="ln" stroke-width="1.3" marker-end="url(#rfc-0003-which-key-wraps-which-m)"/>
  <rect class="mask" x="718.2" y="500" width="51.599999999999994" height="18"/>
  <text x="744" y="512" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">INSIDE</text>
  <path d="M136,288 L136,556 Q136,564 144,564 L334,564" class="ln" stroke-width="1.3" marker-end="url(#rfc-0003-which-key-wraps-which-m)"/>
  <rect class="mask" x="113.5" y="420" width="45" height="18"/>
  <text x="136" y="432" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">SIGNS</text>
  <rect class="plain" x="32" y="40" width="208" height="88" rx="6"/>
  <text x="46" y="62" class="t" font-size="14" font-weight="600">Account key</text>
  <text x="46" y="82" class="m" font-size="12.5">Ed25519; certifies the</text>
  <text x="46" y="100" class="m" font-size="12.5">account's member keys</text>
  <rect class="plain" x="32" y="200" width="208" height="88" rx="6"/>
  <text x="46" y="222" class="t" font-size="14" font-weight="600">Member key</text>
  <text x="46" y="242" class="m" font-size="12.5">Ed25519 and X25519;</text>
  <text x="46" y="260" class="m" font-size="12.5">never leaves the member</text>
  <rect class="box" x="336" y="40" width="208" height="88" rx="6"/>
  <text x="350" y="62" class="t" font-size="14" font-weight="600">Previous generations</text>
  <text x="350" y="82" class="m" font-size="12.5">the key chain, back</text>
  <text x="350" y="100" class="m" font-size="12.5">to generation 1</text>
  <rect class="focal" x="336" y="200" width="208" height="88" rx="6"/>
  <text x="350" y="222" class="t" font-size="14" font-weight="600">Space key generation</text>
  <text x="350" y="242" class="m" font-size="12.5">32 random bytes; a new</text>
  <text x="350" y="260" class="m" font-size="12.5">generation at each rotation</text>
  <rect class="plain" x="640" y="200" width="208" height="88" rx="6"/>
  <text x="654" y="222" class="t" font-size="14" font-weight="600">Person key</text>
  <text x="654" y="242" class="m" font-size="12.5">one per person per space;</text>
  <text x="654" y="260" class="m" font-size="12.5">destroying it erases</text>
  <rect class="box" x="336" y="360" width="208" height="88" rx="6"/>
  <text x="350" y="382" class="t" font-size="14" font-weight="600">Content key</text>
  <text x="350" y="402" class="m" font-size="12.5">derived with HKDF-SHA256</text>
  <text x="350" y="420" class="m" font-size="12.5">from the generation</text>
  <rect class="box" x="640" y="360" width="208" height="88" rx="6"/>
  <text x="654" y="382" class="t" font-size="14" font-weight="600">Personal fields</text>
  <text x="654" y="402" class="m" font-size="12.5">of that person</text>
  <rect class="plain" x="336" y="520" width="208" height="88" rx="6"/>
  <text x="350" y="542" class="t" font-size="14" font-weight="600">A change</text>
  <text x="350" y="562" class="m" font-size="12.5">its payload is sealed;</text>
  <text x="350" y="580" class="m" font-size="12.5">its header is signed</text>
  <text x="440" y="648" class="m" font-size="12.5" text-anchor="middle">An arrow points from a key to what it certifies, protects or produces.</text>
</svg>
