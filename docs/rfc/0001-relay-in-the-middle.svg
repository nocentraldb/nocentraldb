<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" role="img" aria-labelledby="rfc-0001-relay-title rfc-0001-relay-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="rfc-0001-relay-title">The relay stores and forwards encrypted changes</title>
  <desc id="rfc-0001-relay-desc">Members, such as a person's device, an agent, a cloud function that reads content and an adapter, push encrypted changes to a relay and pull or subscribe to receive them; the relay holds no keys, checks signatures, membership and the right to write, appends to each space's log and hands changes out from a cursor.</desc>
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .ac { fill: #0969da; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; }
    .plain { fill: #ffffff; stroke: #d1d9e0; }
    .focal { fill: #ddf4ff; stroke: #0969da; }
    .zone { fill: none; stroke: #d1d9e0; }
    .zonea { fill: #0969da; fill-opacity: 0.05; stroke: #0969da; }
    .frame { fill: #f6f8fa; stroke: #d1d9e0; }
    .life { stroke: #d1d9e0; }
    .ln { stroke: #59636e; fill: none; }
    .lna { stroke: #0969da; fill: none; }
    .mk { fill: #59636e; }
    .mka { fill: #0969da; }
    .mask { fill: #ffffff; }
    .num { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .ac { fill: #4493f8; }
      .box { fill: #161b22; stroke: #3d444d; }
      .plain { fill: #0d1117; stroke: #3d444d; }
      .focal { fill: #0c2d4a; stroke: #4493f8; }
      .zone { stroke: #3d444d; }
      .zonea { fill: #4493f8; fill-opacity: 0.08; stroke: #4493f8; }
      .frame { fill: #161b22; stroke: #3d444d; }
      .life { stroke: #3d444d; }
      .ln { stroke: #9198a1; }
      .lna { stroke: #4493f8; }
      .mk { fill: #9198a1; }
      .mka { fill: #4493f8; }
      .mask { fill: #0d1117; }
      .num { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="rfc-0001-relay-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mk"/></marker>
    <marker id="rfc-0001-relay-ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mka"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="880" height="356"/>
  <path d="M228,96 L324,96" class="ln" stroke-width="1.3" marker-end="url(#rfc-0001-relay-m)" marker-start="url(#rfc-0001-relay-m)"/>
  <rect class="mask" x="246.9" y="72" width="58.199999999999996" height="18"/>
  <text x="276" y="84" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">CHANGES</text>
  <path d="M228,236 L324,236" class="ln" stroke-width="1.3" marker-end="url(#rfc-0001-relay-m)" marker-start="url(#rfc-0001-relay-m)"/>
  <path d="M556,96 L652,96" class="ln" stroke-width="1.3" marker-end="url(#rfc-0001-relay-m)" marker-start="url(#rfc-0001-relay-m)"/>
  <rect class="mask" x="574.9" y="72" width="58.199999999999996" height="18"/>
  <text x="604" y="84" class="m" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">CHANGES</text>
  <path d="M556,236 L652,236" class="ln" stroke-width="1.3" marker-end="url(#rfc-0001-relay-m)" marker-start="url(#rfc-0001-relay-m)"/>
  <rect class="plain" x="24" y="56" width="204" height="80" rx="6"/>
  <text x="38" y="78" class="t" font-size="14" font-weight="600">A person's device</text>
  <text x="38" y="98" class="m" font-size="12.5">a browser, a phone, a laptop</text>
  <rect class="plain" x="24" y="196" width="204" height="80" rx="6"/>
  <text x="38" y="218" class="t" font-size="14" font-weight="600">An agent</text>
  <text x="38" y="238" class="m" font-size="12.5">its own member key and role</text>
  <rect class="focal" x="324" y="40" width="232" height="252" rx="6"/>
  <text x="338" y="58" class="ac" font-size="10" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">RELAY</text>
  <text x="338" y="78" class="t" font-size="14" font-weight="600">Holds no keys</text>
  <text x="338" y="98" class="m" font-size="12.5">reads no content</text>
  <text x="338" y="116" class="m" font-size="12.5"></text>
  <text x="338" y="134" class="m" font-size="12.5">checks signatures, membership</text>
  <text x="338" y="152" class="m" font-size="12.5">and the right to write</text>
  <text x="338" y="170" class="m" font-size="12.5">appends to each space's log</text>
  <text x="338" y="188" class="m" font-size="12.5">hands changes out from a cursor</text>
  <text x="338" y="206" class="m" font-size="12.5"></text>
  <text x="338" y="224" class="m" font-size="12.5">SQLite, Postgres, or</text>
  <text x="338" y="242" class="m" font-size="12.5">DynamoDB with S3</text>
  <rect class="plain" x="652" y="56" width="204" height="80" rx="6"/>
  <text x="666" y="78" class="t" font-size="14" font-weight="600">A cloud function</text>
  <text x="666" y="98" class="m" font-size="12.5">reads content, so it joins</text>
  <text x="666" y="116" class="m" font-size="12.5">as a member with its own key</text>
  <rect class="plain" x="652" y="196" width="204" height="80" rx="6"/>
  <text x="666" y="218" class="t" font-size="14" font-weight="600">An adapter</text>
  <text x="666" y="238" class="m" font-size="12.5">a member of the space,</text>
  <text x="666" y="256" class="m" font-size="12.5">not part of the relay</text>
  <text x="440" y="324" class="m" font-size="12.5" text-anchor="middle">Every member runs the same core with a full copy of its spaces.</text>
  <text x="440" y="342" class="m" font-size="12.5" text-anchor="middle">The relay sees metadata, and reads the control changes that carry the membership rules.</text>
</svg>
