# Root project: gates the root config files that belong to no other project.
id: repo
language: javascript
layer: configuration

tasks:
  format-check:
    # The inputs below mirror the paths in the command; add a root file to both.
    command: "biome check --error-on-warnings package.json biome.json tsconfig.base.json pnpm-workspace.yaml moon.yml .moon scripts"
    inputs:
      - "/package.json"
      - "/biome.json"
      - "/tsconfig.base.json"
      - "/pnpm-workspace.yaml"
      - "/moon.yml"
      - "/.moon/**/*.yml"
      - "/scripts/**/*"
  pins:
    command: "node scripts/check-pins.mjs"
    inputs:
      - "/.prototools"
      - "/.nvmrc"
      - "/scripts/check-pins.mjs"
      - "/package.json"
      - "/pnpm-workspace.yaml"
      - "/apps/*/package.json"
      - "/packages/*/package.json"
  test:
    # Tests of the repository tooling (scripts/*.test.mjs, incl. the workflow
    # contracts: scripts/changes-workflow.test.mjs, and the CI contract in
    # scripts/ci-workflow.test.mjs, which also reads the root `gates` script in
    # package.json and .github/dependabot.yml; both parse YAML with the `yaml`
    # devDependency, hence the lockfile input) and of the release tooling under
    # scripts/release/ (incl. lib/). Both patterns are quoted: node --test
    # expands them itself, so the run does not depend on the shell's globstar.
    command: "node --test 'scripts/*.test.mjs' 'scripts/release/**/*.test.mjs'"
    inputs:
      - "/scripts/**/*"
      - "/package.json"
      - "/.github/workflows/**/*"
      - "/.github/dependabot.yml"
      - "/pnpm-workspace.yaml"
      - "/pnpm-lock.yaml"
      - "/changes/**/*"
  fragments:
    # Every change fragment under changes/ follows the schema in
    # docs/release-management.md. The PR-level required-fragment rule is not
    # here: it needs the PR's base, so it belongs to the `changes` check
    # (.github/workflows/changes.yml). The front matter is parsed with the
    # `yaml` devDependency, hence the lockfile input; the script also imports
    # lib/git.mjs and lib/glob.mjs for its PR mode.
    command: "node scripts/release/check-fragments.mjs"
    inputs:
      - "/changes/**/*"
      - "/scripts/release/check-fragments.mjs"
      - "/scripts/release/lib/fragments.mjs"
      - "/scripts/release/lib/git.mjs"
      - "/scripts/release/lib/glob.mjs"
      - "/pnpm-lock.yaml"
  rust-toolchain:
    # Installs the toolchain rust-toolchain.toml pins, once, before any Rust
    # task runs; a no-op (and offline) when it is already installed.
    command: "rustup toolchain install --no-self-update"
    inputs:
      - "/rust-toolchain.toml"
  gates:
    deps: ["~:format-check", "~:pins", "~:test", "~:fragments"]
