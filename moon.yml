# Root project: gates the root config files that belong to no other project.
id: repo
language: javascript
layer: configuration

tasks:
  format-check:
    # The inputs below mirror the paths in the command; add a root file to both.
    command: "biome check --error-on-warnings package.json biome.json tsconfig.base.json pnpm-workspace.yaml moon.yml .moon scripts"
    inputs:
      - "/package.json"
      - "/biome.json"
      - "/tsconfig.base.json"
      - "/pnpm-workspace.yaml"
      - "/moon.yml"
      - "/.moon/**/*.yml"
      - "/scripts/**/*"
  pins:
    # Reads every Cargo.toml with the smol-toml devDependency, hence the
    # Cargo.toml globs and the lockfile input.
    command: "node scripts/check-pins.mjs"
    inputs:
      - "/.prototools"
      - "/.nvmrc"
      - "/scripts/check-pins.mjs"
      - "/package.json"
      - "/pnpm-workspace.yaml"
      - "/apps/*/package.json"
      - "/packages/*/package.json"
      - "/pnpm-lock.yaml"
      - "/Cargo.toml"
      - "/**/Cargo.toml"
  file-size:
    # No tracked code or test file is longer than the limit in the row
    # "Largest code or test file" of factory/CONFIG.md (NOC-43). It reads the
    # file list from git, which leaves out node_modules/ and target/; the
    # script skips them as well.
    command: "node scripts/check-file-size.mjs"
    inputs:
      - "/factory/CONFIG.md"
      - "/scripts/check-file-size.mjs"
      - "/**/*.{rs,ts,tsx,js,mjs,cjs,sh,py}"
  test:
    # Tests of the repository tooling (scripts/*.test.mjs, incl. the workflow
    # contracts: scripts/changes-workflow.test.mjs and
    # scripts/release-workflow.test.mjs (the rules for every job),
    # scripts/release-workflow-alpha.test.mjs and
    # scripts/release-workflow-publish.test.mjs (the alpha and publish jobs),
    # scripts/release-ruleset.test.mjs
    # (commit-back pushes under the ruleset's bypass, and
    # docs/release-management.md gives the owner its settings step), the
    # toolchain contract in
    # scripts/toolchain-workflow.test.mjs (it also reads .moon/toolchains.yml
    # and runs scripts/install-toolchain.sh), and the CI contract in
    # scripts/ci-workflow.test.mjs, which also reads the root `gates` script in
    # package.json and .github/dependabot.yml; both parse YAML with the `yaml`
    # devDependency, hence the lockfile input), the contributor kit check in
    # scripts/contributor-kit.test.mjs (it reads .github/, CONTRIBUTING.md,
    # README.md and the docs its links point into, and the moon config of
    # every project, whose gate tasks the task table of docs/repository.md
    # must list), scripts/readme.test.mjs (the README's sections, its RFC
    # links, and that its examples use only names the RFCs define), the
    # RFC check in
    # scripts/rfc.test.mjs (RFC 0002 exists and links back to RFC 0001) and
    # scripts/rfc-0004.test.mjs (RFC 0004 exists, links back to RFC 0001 and has
    # its sections), scripts/rfc-0004-examples.test.mjs (the byte-exact examples
    # of RFC 0004, "Byte-exact examples", are canonical CBOR and equal the committed
    # vectors in docs/rfc/vectors/0004), scripts/rfc-0002-rules.test.mjs (the
    # rules RFC 0002 states, among them the writer's model in payload key 64,
    # and its examples equal the committed vectors in docs/rfc/vectors/0002),
    # scripts/rfc-0001.test.mjs (RFC 0001,
    # the FAQ, the use cases and factory/GENESIS.md name what the relay sees and
    # every erasure limit, and their links resolve; the /factory/**/* input
    # covers GENESIS.md), scripts/rfc-0008-alignment.test.mjs (RFC 0001, 0002,
    # 0003, 0006, GENESIS.md and the FAQ follow RFC 0008, and
    # factory/decisions/ records NOC-44), scripts/rfc-0007-alignment.test.mjs
    # (RFC 0002's "On the relay", use cases 4 and 5 and every text on what the
    # relay sees follow RFC 0007, and factory/decisions/ records NOC-47),
    # scripts/rfc-feedback.test.mjs (factory/decisions/ records NOC-55, pm's
    # tick reads the "RFC feedback" category, and RFC 0002 to 0005, 0007 and
    # 0008 say how to give feedback), scripts/rfc-status.test.mjs (an RFC the
    # decision log records as decided by the owner never says Draft; NOC-35),
    # scripts/decided-rfcs-alignment.test.mjs (the FAQ, RFC 0001, the use cases
    # and GENESIS.md follow RFC 0003, 0005 and 0006),
    # scripts/groups-withdrawn.test.mjs (groups leave RFC 0001, 0008, 0009 and
    # the docs, and factory/decisions/ records NOC-76),
    # scripts/rfc-0009-alignment.test.mjs (RFC 0001, 0003, 0005, 0006, 0008
    # and the use cases follow RFC 0009's Conflicts; NOC-75),
    # scripts/rfc-0006-integrated.test.mjs and
    # scripts/rfc-0009-integrated.test.mjs (each RFC is one complete text,
    # and the rules it took in stand where they belong, among them RFC 0005's
    # D16 on unsafe ints and the TypeScript object id, NOC-80, and RFC 0005's
    # D19 to D21 on references, NOC-92), and the tests of the
    # release tooling under scripts/release/ (incl. lib/; index.test.mjs holds
    # the committed release-notes/index.json to its shape). Both patterns are
    # quoted: node --test expands them itself, so the run does not depend on
    # the shell's globstar. The set-version test runs cargo in a two-crate
    # fixture on the pinned toolchain, hence the rust-toolchain dependency;
    # so does scripts/wasm-gate.test.mjs, which reads the wasm tasks of
    # crates/ncdb-core/moon.yml, checks that every #[test] of ncdb-core also
    # runs on wasm32, and builds a platform-only crate for wasm32 to prove the
    # build-wasm task fails on it. scripts/decisions.test.mjs tests the
    # decision log tooling and reads factory/ and this file;
    # scripts/check-file-size.test.mjs reads this file too.
    # scripts/session-start-git.test.mjs runs the session start's git repair
    # in throwaway repositories, and scripts/session-start-wiring.test.mjs
    # reads .claude/settings.json and factory/roles/coder.md (NOC-52).
    command: "node --test 'scripts/*.test.mjs' 'scripts/release/**/*.test.mjs'"
    deps: ["~:rust-toolchain"]
    inputs:
      - "/rust-toolchain.toml"
      - "/scripts/**/*"
      - "/package.json"
      - "/.github/**/*"
      - "/.moon/toolchains.yml"
      - "/pnpm-workspace.yaml"
      - "/pnpm-lock.yaml"
      - "/changes/**/*"
      - "/release-notes/**/*"
      - "/CONTRIBUTING.md"
      - "/README.md"
      - "/docs/**/*"
      - "/moon.yml"
      - "/.moon/tasks/*.yml"
      - "/crates/*/moon.yml"
      - "/packages/*/moon.yml"
      - "/AGENTS.md"
      - "/.claude/**/*"
      - "/factory/**/*"
      - "/crates/ncdb-core/src/**/*"
      - "/crates/ncdb-core/tests/**/*"
  fragments:
    # Every change fragment under changes/ follows the schema in
    # docs/release-management.md. The PR-level required-fragment rule is not
    # here: it needs the PR's base, so it belongs to the `changes` check
    # (.github/workflows/changes.yml). The front matter is parsed with the
    # `yaml` devDependency, hence the lockfile input; the script also imports
    # lib/git.mjs and lib/glob.mjs for its PR mode.
    command: "node scripts/release/check-fragments.mjs"
    inputs:
      - "/changes/**/*"
      - "/scripts/release/check-fragments.mjs"
      - "/scripts/release/lib/fragments.mjs"
      - "/scripts/release/lib/git.mjs"
      - "/scripts/release/lib/glob.mjs"
      - "/pnpm-lock.yaml"
  decisions:
    # The decision log: one file per decision in factory/decisions/, each with
    # a well-formed name, heading and fields, and every Supersedes: naming a
    # file that exists (NOC-27). `pnpm decisions` reads the same folder.
    command: "node scripts/decisions.mjs --check"
    inputs:
      - "/factory/decisions/**/*"
      - "/scripts/decisions.mjs"
  version:
    # The one version of the project: Cargo.toml [workspace.package] holds a
    # plain X.Y.Z, every crate inherits it, inter-crate dependencies are
    # pinned to it in [workspace.dependencies], and every workspace
    # package.json and Cargo.lock carry it (docs/release-management.md,
    # "Versioning").
    command: "node scripts/release/check-version.mjs"
    inputs:
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/crates/*/Cargo.toml"
      - "/packages/*/package.json"
      - "/apps/*/package.json"
      - "/scripts/release/check-version.mjs"
      - "/scripts/release/lib/*.mjs"
  api-report:
    # The TypeScript SDK's API report is current: tsc regenerates the public
    # declarations of packages/sdk/src and they must equal the committed
    # packages/sdk/etc/api-report.d.ts (docs/release-management.md, "Supply
    # chain and policies"). The `changes` check diffs it against the PR's base.
    command: "node scripts/release/api-report.mjs"
    inputs:
      - "/packages/sdk/src/**/*"
      - "/packages/sdk/etc/**/*"
      - "/packages/sdk/tsconfig.json"
      - "/tsconfig.base.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/scripts/release/api-report.mjs"
      - "/scripts/release/lib/*.mjs"
  rust-toolchain:
    # Installs the toolchain rust-toolchain.toml pins, once, before any Rust
    # task runs; a no-op (and offline) when it is already installed.
    command: "rustup toolchain install --no-self-update"
    inputs:
      - "/rust-toolchain.toml"
  wasm-runner:
    # Installs wasm-bindgen-test-runner, which runs the wasm32 tests of the
    # crates (crates/ncdb-core/moon.yml, test-wasm), into target/tools: CI
    # caches target/, so a warm run reuses it. Its version must equal the
    # wasm-bindgen that Cargo.lock holds; a mismatch fails the run loudly.
    # A no-op when that version is already installed there.
    command: "cargo install wasm-bindgen-cli --version =0.2.130 --locked --root target/tools"
    deps: ["~:rust-toolchain"]
    inputs:
      - "/moon.yml"
      - "/rust-toolchain.toml"
  site:
    # NOC-213: the site (site/, its own pnpm project, outside the workspace)
    # installs from its lockfile, builds, and passes the checks of its built
    # output (the output test in site/'s scripts folder): the landing page
    # and the docs, /llms.txt and /llms-full.txt naming nocentraldb.io, a
    # Markdown copy of every docs page, and the CNAME.
    # scripts/site-gate.test.mjs asserts this task; the workflow
    # site-pages.yml runs the same steps before it deploys. The install needs
    # the network on a cold pnpm store.
    script: "pnpm --dir site install --frozen-lockfile && pnpm --dir site build && node --test 'site/scripts/*.test.mjs'"
    inputs:
      - "/site/**/*"
      - "!/site/dist/**/*"
      - "!/site/node_modules/**/*"
  browser-storage:
    # NOC-33: the browser storage probe in Chromium, Firefox and WebKit,
    # through Playwright (scripts/browser-storage/, docs/browser-storage.md).
    # Not part of `gates`: it needs the browsers, installed with
    # `pnpm exec playwright install --with-deps chromium firefox webkit`, and
    # the workflow browser-storage.yml runs it in CI. Never cached: its
    # result depends on the installed browsers, which are no input.
    command: "node --test 'scripts/browser-storage/*.test.mjs'"
    inputs:
      - "/scripts/browser-storage/**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
    options:
      cache: false
  browser-view:
    # NOC-174: the core's view in a dedicated worker on OPFS, in Chromium,
    # Firefox and WebKit through Playwright, compared with the same code run
    # natively (scripts/browser-view/). Not part of `gates`, for the reasons
    # of browser-storage above; the workflow browser-view.yml runs it in CI.
    # Never cached: its result depends on the installed browsers.
    command: "node --test 'scripts/browser-view/*.test.mjs'"
    deps: ["~:wasm-runner"]
    inputs:
      - "/scripts/browser-view/**/*"
      - "/crates/ncdb-core/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/package.json"
      - "/pnpm-lock.yaml"
    options:
      cache: false
  sdk-browser:
    # NOC-176 slice 1: the TypeScript SDK in Chromium through Playwright
    # (scripts/sdk-browser/): it builds packages/sdk, its core in wasm
    # included, and opens it in a page as an app does; slice 4 syncs it
    # with the local relay server, which it builds too. Not part of `gates`,
    # for the reasons of browser-storage above; the workflow browser-view.yml
    # runs it in CI. Never cached: its result depends on the installed
    # browser.
    command: "node --test 'scripts/sdk-browser/*.test.mjs'"
    deps: ["~:wasm-runner"]
    inputs:
      - "/scripts/sdk-browser/**/*"
      - "/packages/sdk/**/*"
      - "/crates/nocentraldb/**/*"
      - "/crates/nocentraldb-wasm/**/*"
      - "/crates/ncdb-relay/**/*"
      - "/crates/ncdb-relay-server/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/package.json"
      - "/pnpm-lock.yaml"
    options:
      cache: false
  site-demo:
    # NOC-319: the landing page's live demo in Chromium through Playwright
    # (scripts/site-demo/): it builds packages/sdk, its core in wasm
    # included, copies it into the site and builds the site, then checks
    # that the page renders before the demo downloads anything, and that
    # the demo shows its loading and failure states, runs and shares its
    # database with a second tab. Not part of `gates`, for the reasons of
    # browser-storage above; the workflow browser-view.yml runs it in CI.
    # Never cached: its result depends on the installed browser.
    command: "node --test 'scripts/site-demo/*.test.mjs'"
    deps: ["~:wasm-runner"]
    inputs:
      - "/scripts/site-demo/**/*"
      - "/site/**/*"
      - "!/site/dist/**/*"
      - "!/site/node_modules/**/*"
      - "/packages/sdk/**/*"
      - "/crates/nocentraldb/**/*"
      - "/crates/nocentraldb-wasm/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
    options:
      cache: false
  sdk-keys:
    # NOC-175 slice 2: the Rust SDK's keys in IndexedDB in a dedicated
    # worker in Chromium through Playwright (scripts/sdk-keys/), and its
    # syncing there with the local relay server, which it starts. Not part
    # of `gates`, for the reasons of browser-storage above; the workflow
    # browser-view.yml runs it in CI. Never cached: its result depends on
    # the installed browser.
    command: "node --test 'scripts/sdk-keys/*.test.mjs'"
    deps: ["~:wasm-runner"]
    inputs:
      - "/scripts/sdk-keys/**/*"
      - "/crates/nocentraldb/**/*"
      - "/crates/ncdb-relay/**/*"
      - "/crates/ncdb-relay-server/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/package.json"
      - "/pnpm-lock.yaml"
    options:
      cache: false
  gates:
    deps:
      - "~:format-check"
      - "~:pins"
      - "~:file-size"
      - "~:test"
      - "~:fragments"
      - "~:decisions"
      - "~:version"
      - "~:api-report"
      - "~:site"
